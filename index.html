<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<meta property="og:description" content="Arma tu menú día por día y mira cuánto cuesta en tu mercado y en el súper. Versión de prueba: dame tu opinión.">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acuánto">
<title>Acuánto</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
  /* Layout: app de una columna (máx. 480px) con cabecera fija arriba y barra de 3 botones grandes abajo.
     Lo memorable: los precios en etiquetas de cartón como las pizarras del mercado. Todo lo demás, sobrio y grande. */
  :root {
    --bg: #f3f6f1;
    --surface: #ffffff;
    --ink: #17201a;
    --muted: #4b5a50;
    --line: #d3dcd1;
    --green: #0b6b3a;
    --green-ink: #ffffff;
    --green-soft: #e1f2e7;
    --red: #b42318;
    --red-soft: #fde7e3;
    --same: #46555f;
    --same-soft: #e7ecef;
    --kraft: #dcb77d;
    --kraft-ink: #26180a;
    --yellow: #ffd60a;
    --yellow-ink: #1d1a00;
    --alert-bg: #fff3bf;
    --alert-ink: #3d3100;
    --amber: #8a5300;
    --font-brand: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1410; --surface: #19211b; --ink: #eef3ee; --muted: #b5c2b8; --line: #2d382f;
      --green: #4cc584; --green-ink: #062012; --green-soft: #143222; --red: #ff8b76; --red-soft: #3b1712;
      --same: #b3c3cd; --same-soft: #26313a; --kraft: #c9a46b; --kraft-ink: #1f1308;
      --alert-bg: #3a3205; --alert-ink: #fff0a8; --amber: #f0b45a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1410; --surface: #19211b; --ink: #eef3ee; --muted: #b5c2b8; --line: #2d382f;
    --green: #4cc584; --green-ink: #062012; --green-soft: #143222; --red: #ff8b76; --red-soft: #3b1712;
    --same: #b3c3cd; --same-soft: #26313a; --kraft: #c9a46b; --kraft-ink: #1f1308;
    --alert-bg: #3a3205; --alert-ink: #fff0a8; --amber: #f0b45a; color-scheme: dark;
  }
  html { font-size: 19px; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
         -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--green); }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--green); color: var(--green-ink);
               padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
               padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: grid; gap: 0; min-width: 0; }
  .brand b { font-family: var(--font-brand); font-weight: 400; font-size: 1.45rem; line-height: 1.05; letter-spacing: 0.01em; }
  .brand span { font-size: 0.78rem; opacity: 0.92; }
  .aa { min-width: 56px; min-height: 52px; border-radius: 12px; border: 2px solid currentColor; background: transparent;
        color: var(--green-ink); font-weight: 700; font-size: 1rem; padding: 0 10px; }

  main { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 16px 128px; display: grid; gap: 18px; align-content: start; }
  h1, h2 { margin: 0; line-height: 1.2; text-wrap: balance; }
  h1 { font-size: 1.55rem; }
  h2 { font-size: 1.2rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  /* Botones grandes */
  .btn { min-height: 60px; border-radius: var(--radius); border: 2px solid var(--green); background: var(--green); color: var(--green-ink);
         font-weight: 700; font-size: 1.05rem; padding: 12px 18px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .btn.sec { background: var(--surface); color: var(--green); }
  .btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .back { justify-self: start; min-height: 52px; padding: 0 14px 0 6px; border: none; background: transparent; color: var(--green);
          font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 4px; }

  /* Tarjetas de opción */
  .choice { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%;
            min-height: 92px; padding: 14px 16px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); }
  .choice[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
  .choice .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 1.6rem; }
  .choice b { display: block; font-size: 1.1rem; }
  .choice span { color: var(--muted); font-size: 0.9rem; }

  /* Chips de mercados */
  .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chip { flex: 0 0 auto; min-height: 52px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface);
          font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.add { border-style: dashed; color: var(--green); }

  .alert { background: var(--alert-bg); color: var(--alert-ink); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .alert .bang { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
  .note { border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--muted); font-size: 0.88rem; }

  /* Fila de producto con etiqueta de cartón */
  .list { display: grid; gap: 12px; }
  .prod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "emo name tag" "meta meta meta"; gap: 6px 12px; align-items: center; width: 100%; text-align: left;
          background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .prod .emo { grid-area: emo; } .prod .name { grid-area: name; } .prod .tag { grid-area: tag; }
  .prod .meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .prod .emo { font-size: 2rem; line-height: 1; text-align: center; }
  .prod .name { font-weight: 700; font-size: 1.15rem; }
  .prod .src { font-size: 0.82rem; color: var(--muted); }
  .tag { background: var(--kraft); color: var(--kraft-ink); border-radius: 6px; padding: 6px 10px 4px; text-align: right; transform: rotate(-1.5deg);
         box-shadow: 0 2px 0 rgba(0,0,0,0.12); min-width: 104px; }
  .tag .p { font-weight: 700; font-size: 1.45rem; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag .u { font-size: 0.78rem; }
  .tag.big .p { font-size: 2.2rem; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 0.85rem; border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
  .pill.up { background: var(--red-soft); color: var(--red); }
  .pill.down { background: var(--green-soft); color: var(--green); }
  .pill.same { background: var(--same-soft); color: var(--same); }
  .cheap { display: inline-block; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: 0.85rem; border-radius: 6px; padding: 2px 8px; }

  .card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: none; }

  /* Formularios */
  label.lbl { font-weight: 700; display: block; margin-bottom: 6px; }
  select.big, input.big { width: 100%; min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 1.1rem; }
  .money { display: grid; grid-template-columns: 60px minmax(0, 1fr) 60px; gap: 8px; align-items: center; }
  .money button { min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; font-weight: 700; }
  .money input { text-align: center; font-weight: 700; font-size: 1.5rem; }
  .grid-prod { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { min-height: 96px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; gap: 4px; padding: 10px; font-weight: 700; text-align: center; }
  .tile .emo { font-size: 2rem; line-height: 1; }
  .tile[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
  .item { display: grid; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .item .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .x { min-width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-weight: 700; }
  .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius); border: 2px solid var(--line); }
  .status { font-weight: 700; }

  /* Puntos */
  .points { text-align: center; display: grid; gap: 4px; padding: 20px 16px; }
  .points .n { font-family: var(--font-brand); font-size: 3rem; line-height: 1; color: var(--green); }
  .reward { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .reward .btn { width: auto; min-width: 128px; min-height: 52px; font-size: 0.95rem; }
  .hist { display: grid; gap: 6px; font-size: 0.9rem; }
  .hist div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 6px 0; }

  .done { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 24px; }
  .done .ok { width: 96px; height: 96px; border-radius: 50%; background: var(--green); color: var(--green-ink); display: grid; place-items: center; font-size: 3rem; font-weight: 700; }
  .done .pts { font-family: var(--font-brand); font-size: 2rem; color: var(--green); }

  /* Barra inferior */
  nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.bar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 6px; padding: 8px 10px; }
  nav.bar button { min-height: 64px; min-width: 0; border: none; background: transparent; border-radius: 14px; display: grid; justify-items: center; align-content: center; gap: 2px;
                   font-weight: 700; font-size: 0.8rem; line-height: 1.1; text-align: center; padding: 4px 2px; color: var(--muted); }
  nav.bar button svg { width: 28px; height: 28px; }
  nav.bar button[aria-current="page"] { color: var(--green); background: var(--green-soft); }
  nav.bar button.main { background: var(--green); color: var(--green-ink); }
  nav.bar button.main[aria-current="page"] { outline: 3px solid var(--yellow); }
  .spin { width: 40px; height: 40px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--green); animation: rot 0.9s linear infinite; justify-self: center; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1:focus { outline: none; }
  /* Las rejillas no crecen con el contenido: las tiras de chips se desplazan dentro de su caja. */
  main, .card, .list, .grp { grid-template-columns: minmax(0, 1fr); }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .grp-t { font-size: 1rem; color: var(--muted); margin-top: 6px; }

  /* Mi semana */
  .bigstep { display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; gap: 12px; align-items: center; }
  .bigstep button { min-height: 80px; border-radius: 18px; border: 2px solid var(--green); background: var(--surface); color: var(--green); font-size: 2.2rem; font-weight: 700; }
  .bigstep output { text-align: center; font-family: var(--font-brand); font-size: 3.2rem; line-height: 1; color: var(--green); font-variant-numeric: tabular-nums; }
  .plato { display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-areas: "emo name" "emo fila"; gap: 6px 12px; align-items: center;
           background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .plato[data-on="true"] { border-color: var(--green); background: var(--green-soft); }
  .plato .emo { grid-area: emo; font-size: 2rem; line-height: 1; text-align: center; align-self: start; padding-top: 2px; }
  .plato .name { grid-area: name; font-size: 1.12rem; }
  .plato .fila { grid-area: fila; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .plato .meta { flex: 1 1 110px; font-size: 0.88rem; color: var(--muted); display: grid; gap: 4px; justify-items: start; }
  .step { display: inline-grid; grid-template-columns: 52px minmax(2.2ch, auto) 52px; gap: 6px; align-items: center; margin-left: auto; }
  .step button { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; font-weight: 700; color: var(--ink); }
  .step button[disabled] { opacity: 0.4; cursor: not-allowed; }
  .step output { text-align: center; font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .stick { position: sticky; bottom: calc(var(--nav-h, 96px) + 10px); z-index: 10; }
  .stick .btn { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--green); border-radius: var(--radius); overflow: hidden; }
  .seg button { min-height: 56px; border: none; background: var(--surface); color: var(--green); font-weight: 700; padding: 6px 8px; }
  .seg button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
  .grp { display: grid; }
  h3 { margin: 12px 0 0; font-size: 0.95rem; color: var(--muted); }
  .lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "emo nm pr" ". act act"; gap: 6px 10px; align-items: center;
          padding: 10px 0; border-bottom: 1px solid var(--line); }
  .grp .lrow:last-child { border-bottom: none; }
  .lrow .emo { grid-area: emo; font-size: 1.6rem; line-height: 1; text-align: center; align-self: start; }
  .lrow .nm { grid-area: nm; min-width: 0; }
  .lrow .pr { grid-area: pr; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; align-self: start; }
  .lrow .act { grid-area: act; display: flex; flex-wrap: wrap; gap: 8px; }
  .lrow .act .chip { min-height: 48px; font-size: 0.85rem; }
  .lrow.off .nm b, .lrow.off .pr { text-decoration: line-through; opacity: 0.6; }
  .link { background: none; border: none; color: var(--green); font-weight: 700; text-decoration: underline; padding: 0 4px; min-height: 44px; }
  .sug { grid-template-columns: minmax(0, 1fr); }

  /* Cabecera: botones Opinar y Aa */
  .hbtns { display: flex; gap: 8px; flex: 0 0 auto; }
  .opina { min-width: 56px; min-height: 52px; border-radius: 12px; border: 2px solid currentColor; background: transparent; color: var(--green-ink);
           font-weight: 700; font-size: 0.7rem; line-height: 1.05; padding: 2px 6px; display: grid; justify-items: center; align-content: center; }
  .opina span { font-size: 1.05rem; }
  .prem { display: inline-block; justify-self: start; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; border-radius: 6px; padding: 4px 8px; }
  a.btn { text-decoration: none; }
  textarea.big { width: 100%; min-height: 120px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 14px; font: inherit; color: inherit; }

  /* Plan Restaurante */
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 40px minmax(0, 1fr) 34px; grid-template-areas: "emo name chk" "emo meta chk"; gap: 2px 10px; align-items: center; width: 100%;
         text-align: left; min-height: 68px; padding: 10px 12px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); }
  .opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
  .opt .emo { grid-area: emo; font-size: 1.7rem; line-height: 1; text-align: center; }
  .opt .name { grid-area: name; font-weight: 700; }
  .opt .meta { grid-area: meta; font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .opt .chk { grid-area: chk; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; }
  .opt[aria-pressed="true"] .chk { background: var(--green); border-color: var(--green); color: var(--green-ink); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 7.5em), 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 2px; align-content: start; }
  .kpi b { font-size: 1.3rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi.ok { border-color: var(--green); } .kpi.warn { border-color: var(--amber); } .kpi.bad { border-color: var(--red); }
  .semaf { font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
  .semaf.ok { color: var(--green); } .semaf.warn { color: var(--amber); } .semaf.bad { color: var(--red); }
  .drow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .drow:last-of-type { border-bottom: none; }
  .prow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "emo nm sub" ". inp inp"; gap: 6px 10px; align-items: center;
          padding: 10px 0; border-bottom: 1px solid var(--line); }
  .prow .emo { grid-area: emo; font-size: 1.5rem; line-height: 1; text-align: center; align-self: start; }
  .prow .nm { grid-area: nm; min-width: 0; }
  .prow .sub { grid-area: sub; font-weight: 700; white-space: nowrap; align-self: start; font-variant-numeric: tabular-nums; }
  .prow .inp { grid-area: inp; display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
  .prow .inp input::placeholder { color: var(--muted); font-weight: 400; opacity: 0.8; }
  .prow .inp input { width: 6.5em; min-height: 48px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); padding: 6px 10px;
                     font-weight: 700; font-size: 1rem; color: var(--ink); }
  /* Semana día por día */
  .dias { display: grid; gap: 10px; }
  .dia { display: grid; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .dia.on { border-color: var(--green); }
  .dia .dn { font-size: 1.1rem; text-transform: capitalize; }
  .dchips { display: flex; flex-wrap: wrap; gap: 8px; }

    </button>
    <button class="choice" data-act="rol" data-v="puesto" aria-pressed="${p.rol === "puesto"}">

    </button>
    <button class="choice" data-act="rol" data-v="resto" aria-pressed="${p.rol === "resto"}">
      <span class="ic" aria-hidden="true">🍲</span><span><b>Tengo un restaurante o menú</b><span>Costo de mi menú y pedido a mis proveedores</span>
        <span class="prem" style="margin-top:6px">PREMIUM · GRATIS EN LA PRUEBA</span></span>
    </button>
    <p class="note">Versión de prueba con precios de ejemplo. Cuando quieras, toca <b>💬 Opinar</b> arriba y cuéntanos qué mejorarías.</p>`;
  if (state.paso === 2) return `
    <button class="back" data-act="paso" data-v="1">‹ Atrás</button>
    <h1>¿Cómo lees mejor?</h1>
    <p class="muted">Elige el tamaño de letra. Lo puedes cambiar cuando quieras con el botón Aa.</p>
    <div class="list">${LETRAS.map((l) => `
      <button class="choice" data-act="letra" data-v="${l.id}" aria-pressed="${p.letra === l.id}" style="grid-template-columns:1fr auto">

        <span class="tag"><span class="p" style="font-size:${(l.px / 19) * 1.45}rem">S/ 4.50</span></span>
      </button>`).join("")}</div>
    <button class="btn" data-act="paso" data-v="3">Seguir</button>`;
  const enDistrito = MERCADOS.filter((m) => m.distrito === p.distrito);
  const distritos = [...new Set(MERCADOS.map((m) => m.distrito))].sort();
  return `
    <button class="back" data-act="paso" data-v="2">‹ Atrás</button>
    <h1>${p.rol === "compra" ? "Elige tus mercados" : "¿Qué mercados quieres ver?"}</h1>
    <p class="muted">Gratis puedes seguir hasta ${GRATIS} mercados. Con puntos puedes ver más.</p>
    <div><label class="lbl" for="sel-distrito">Distrito</label>
      <select class="big" id="sel-distrito">${distritos.map((d) => `<option ${d === p.distrito ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
    <div class="list">${enDistrito.map((m) => `
      <button class="choice" data-act="mercado" data-v="${m.id}" aria-pressed="${p.mercados.includes(m.id)}" style="grid-template-columns:1fr auto;min-height:72px">
        <span><b>${esc(m.nombre)}</b><span>${esc(m.distrito)}</span></span><span aria-hidden="true" style="font-size:1.5rem">${p.mercados.includes(m.id) ? "✔" : "＋"}</span>
      </button>`).join("")}</div>
    ${state.aviso ? `<p class="note" role="alert">${esc(state.aviso)}</p>` : ""}
    <p class="status">${p.mercados.length} de ${limiteMercados()} elegidos${p.mercados.length ? ": " + misMercados().map((m) => esc(m.nombre)).join(", ") : ""}</p>
    <p class="note">Lista de ejemplo. En la app real se muestran los mercados cerca de ti con tu ubicación.</p>
    <p class="small muted">Tus aportes se publican sin tu nombre y tu número no se comparte. Al seguir aceptas el uso de tus aportes para calcular precios (Ley 29733).</p>
    <button class="btn" data-act="empezar" ${p.mercados.length ? "" : "disabled"}>Empezar</button>`;
}

function filaProducto(p, m) {
  const h = precioHoy(p, m), antes = semanaPasada(p, m), d = r10(h.precio - antes);
  const est = d > 0.05 ? `<span class="pill up">▲ Subió ${soles(d)}</span>` : d < -0.05 ? `<span class="pill down">▼ Bajó ${soles(-d)}</span>` : `<span class="pill same">= Igual</span>`;
  const src = h.observado ? `${h.n} ${h.n === 1 ? "persona lo vio" : "personas lo vieron"} hoy · ${hora(h.ult)}${h.puesto ? " · incluye puesto" : ""}` : "Estimado de ejemplo";
  const otros = misMercados().filter((o) => o.id !== m.id).map((o) => ({ o, x: precioHoy(p, o).precio })).sort((a, b) => a.x - b.x);
  const barato = otros.length && otros[0].x <= h.precio - 0.3 ? `<span class="cheap">Más barato en ${esc(otros[0].o.nombre.replace("Mercado ", ""))}: ${soles(otros[0].x)}</span>` : "";
  const falta = escasez(p, m) ? `<span class="pill up">Reportan que no hay</span>` : "";
  return `<button class="prod" data-act="producto" data-v="${p.id}">
    <span class="emo" aria-hidden="true">${p.emo}</span>
    <span class="name">${p.nombre}</span>
    <span class="tag"><span class="p">${soles(h.precio)}</span><br><span class="u">${porUnidad(p)}</span></span>
    <span class="meta">${est} ${falta} ${barato}<span class="src">${src}</span></span>
  </button>`;
}

function chipsMercados() {
  const ms = misMercados();
  return `<div class="chips" role="group" aria-label="Tus mercados">${ms.map((m) => `
    <button class="chip" data-act="activo" data-v="${m.id}" aria-pressed="${m.id === state.mercadoActivo}">${esc(m.nombre.replace("Mercado ", ""))}</button>`).join("")}
    <button class="chip add" data-act="editar-mercados">+ Mercados</button></div>`;
}

function vInicio() {
  const m = merc(state.mercadoActivo);
  if (!m) return `<p>Elige un mercado para empezar.</p><button class="btn" data-act="editar-mercados">Elegir mercados</button>`;
  const riesgo = PRODUCTOS.filter((p) => p.riesgo).map((p) => p.nombre.toLowerCase());
  const observados = PRODUCTOS.filter((p) => precioHoy(p, m).observado).length;
  let semanaBtn;
  if (state.perfil.rol === "resto") {
    const ds = diasConMenu(), prom = ds.length ? ds.reduce((a, d) => a + costoDia(d).t, 0) / ds.length : 0;
    semanaBtn = `<button class="btn sec" data-go="semana">🍲 ${ds.length ? `Tu menú: ${soles(prom)} de insumos (${Math.round((prom / state.resto.precioMenu) * 100)}% del precio)` : "¿Cuánto te cuesta tu menú? Calcúlalo"}</button>`;
  } else {
    const best = nPlatos() ? totalesSemana(porComprar())[0] : null;
    semanaBtn = best ? `<button class="btn sec" data-go="semana">🛒 Tu compra de la semana: ${soles(best.t)} en ${esc(corto(best.m))}</button>`
      : `<button class="btn sec" data-go="semana">🛒 ¿Cuánto gastarás esta semana? Arma tu lista</button>`;
  }
  const filtro = state.rubroInicio || "todo";
  return `${chipsMercados()}
    <div class="alert" role="note"><span class="bang" aria-hidden="true">!</span>
      <span><b>Por El Niño pueden subir:</b> ${riesgo.join(", ")}. Compra lo que necesitas y compara antes.</span></div>
    ${semanaBtn}
    <div style="display:grid;gap:4px"><h1>Hoy en ${esc(m.nombre.replace("Mercado ", ""))}</h1>
      <p class="muted small">${observados ? `${observados} de ${PRODUCTOS.length} precios vistos hoy por la gente` : "Aún nadie aportó hoy aquí. Los precios son estimados de ejemplo."}</p></div>
    ${observados ? "" : `<button class="btn sec" data-go="aportar">📷 Sé la primera: foto a una pizarra, +${PUNTOS.foto} puntos</button>`}
    <div class="chips" role="group" aria-label="Ver productos">${[{ id: "todo", corto: "Todo" }, ...RUBROS].map((r) => `
      <button class="chip" data-act="rubro-inicio" data-v="${r.id}" aria-pressed="${filtro === r.id}">${r.corto}</button>`).join("")}</div>
    <div class="list">${RUBROS.filter((r) => filtro === "todo" || r.id === filtro).map((r) => { const ps = PRODUCTOS.filter((p) => p.rubro === r.id);
      return ps.length ? `<h2 class="grp-t">${r.nombre}</h2>${ps.map((p) => filaProducto(p, m)).join("")}` : ""; }).join("")}</div>
    <p class="note">Prototipo con datos de ejemplo. Los precios reales vendrán del mercado mayorista y de los aportes de la gente.</p>`;
}

function vProducto(pid) {
  const p = prod(pid), ms = misMercados();
  const filas = ms.map((m) => ({ m, h: precioHoy(p, m) })).sort((a, b) => a.h.precio - b.h.precio);
  const m = merc(state.mercadoActivo), h = precioHoy(p, m), antes = semanaPasada(p, m);
  const pts = [antes, r10((antes * 2 + h.precio) / 3), r10((antes + h.precio * 2) / 3), h.precio];
  const lo = Math.min(...pts) * 0.97, hi = Math.max(...pts) * 1.03;
  const y = (v) => 64 - ((v - lo) / (hi - lo || 1)) * 56;
  const linea = pts.map((v, i) => `${10 + i * 93},${y(v).toFixed(1)}`).join(" ");
  return `<button class="back" data-go="inicio">‹ Volver a precios</button>
    <div style="display:flex;gap:14px;align-items:center"><span style="font-size:3rem" aria-hidden="true">${p.emo}</span><h1>${p.nombre}</h1></div>
    <div class="card"><h2>En tus mercados hoy</h2>${filas.map((f, i) => `
      <div class="mrow"><span><b>${esc(f.m.nombre)}</b><br><span class="small muted">${f.h.observado ? `${f.h.n} lo vieron hoy` : "Estimado de ejemplo"}</span>
      ${i === 0 && filas.length > 1 ? `<br><span class="cheap">Más barato</span>` : ""}</span>
      <span class="tag"><span class="p">${soles(f.h.precio)}</span><br><span class="u">${porUnidad(p)}</span></span></div>`).join("")}
    </div>
    <div class="card"><h2>En supermercados cercanos</h2>${SUPERS.map((L) => ({ L, x: precioLugar(p, L) })).sort((a, b) => a.x - b.x).map((s) => `
      <div class="mrow"><span><b>${esc(s.L.nombre)}</b><br><span class="small muted">${precioReal(p, s.L) ? `Online, ${fechaCorta(state.superReal.fecha)}` : "Precio online de ejemplo"}${s.x < filas[0].h.precio ? " · más barato que tus mercados" : ""}</span></span>
      <span class="tag"><span class="p">${soles(s.x)}</span><br><span class="u">${porUnidad(p)}</span></span></div>`).join("")}</div>
    <div class="card"><h2>En ${esc(m.nombre.replace("Mercado ", ""))}, esta semana</h2>
      <svg viewBox="0 0 300 76" role="img" aria-label="Pasó de ${soles(antes)} hace una semana a ${soles(h.precio)} hoy" style="width:100%;height:auto">
        <polyline points="${linea}" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="289" cy="${y(h.precio).toFixed(1)}" r="6" fill="var(--green)"/>
      </svg>
      <div style="display:flex;justify-content:space-between" class="small"><span>Hace 7 días<br><b>${soles(antes)}</b></span><span style="text-align:right">Hoy<br><b>${soles(h.precio)}</b></span></div>
    </div>
    <div class="card"><h2>¿Este precio está bien?</h2><p class="muted small">Si estás en el mercado, confírmalo y ganas ${PUNTOS.confirmar} puntos.</p>
      <div class="row2"><button class="btn sec" data-act="confirmar" data-v="${p.id}">Sí, está bien</button>
      <button class="btn sec" data-act="corregir" data-v="${p.id}">No, es otro</button></div></div>`;
}

function vAportar() {
  const ms = misMercados();
  return `<h1>¿Qué quieres aportar?</h1>
    <div><p class="lbl">¿En qué mercado estás?</p>${chipsMercados()}</div>
    ${state.puedeFoto ? `<button class="choice" data-act="ir-foto"><span class="ic" aria-hidden="true">${icono.foto}</span>
      <span><b>Foto a una pizarra</b><span>La app lee los precios por ti · +${PUNTOS.foto} puntos o más</span></span></button>` : ""}
    <button class="choice" data-act="ir-manual"><span class="ic" aria-hidden="true">${icono.escribir}</span>
      <span><b>Escribir un precio</b><span>Producto, precio y listo · +${PUNTOS.manual} puntos</span></span></button>
    <button class="choice" data-act="ir-nohay"><span class="ic" aria-hidden="true">${icono.nohay}</span>
      <span><b>No encontré un producto</b><span>Avisa si no hay o hay poco · +${PUNTOS.nohay} puntos</span></span></button>
    ${state.puedeFoto ? "" : `<p class="note">La lectura de fotos no está disponible en esta vista. Puedes escribir los precios.</p>`}
    <p class="note">En la app real se verifica que estés en el mercado con tu ubicación.</p>`;
}

function vFoto() {
  const b = state.borrador || {};
  if (b.estado === "leyendo") return `<button class="back" data-act="cancelar-foto">‹ Cancelar</button>
    ${b.url ? `<img class="photo" src="${b.url}" alt="Tu foto de la pizarra">` : ""}
    <div class="spin" role="progressbar" aria-label="Leyendo"></div><p class="status" style="text-align:center">Leyendo la pizarra… tarda unos segundos.</p>`;
  if (b.estado === "lista") return `<button class="back" data-go="aportar">‹ Atrás</button>
    <h1>Revisa los precios</h1><p class="muted">Corrige lo que la app leyó mal. Quita lo que no sea de hoy.</p>
    ${b.url ? `<img class="photo" src="${b.url}" alt="Tu foto de la pizarra">` : ""}
    <div class="list">${b.items.map((it, i) => editorItem(it, i)).join("") || `<p class="note">No se pudo leer ningún precio. Prueba otra foto con más luz o escribe el precio.</p>`}</div>
    <button class="btn quiet" data-act="agregar-item">+ Agregar otro producto</button>
    <button class="btn" data-act="enviar-foto" ${b.items.length ? "" : "disabled"}>Enviar ${b.items.length} ${b.items.length === 1 ? "precio" : "precios"}</button>`;
  return `<button class="back" data-go="aportar">‹ Atrás</button>
    <h1>Foto a una pizarra</h1>
    <p class="muted">Acércate a la pizarra o al cartón de precios del puesto. Que se lean los números.</p>
    <label class="btn" for="in-foto">${icono.foto} Abrir la cámara</label>
    <input id="in-foto" class="sr" type="file" accept="image/*" capture="environment">
    ${b.error ? `<p class="note" role="alert">${esc(b.error)}</p>` : ""}`;
}

function editorItem(it, i) {
  const p = it.producto ? prod(it.producto) : null;
  return `<div class="item"><div class="hd"><span>${p ? p.emo + " " + p.nombre : "Nuevo: " + esc(it.libre)}</span>
      <button class="x" data-act="quitar-item" data-v="${i}" aria-label="Quitar ${p ? p.nombre : esc(it.libre)}">✕</button></div>
    <div class="money"><button type="button" data-act="menos" data-v="${i}" aria-label="Diez céntimos menos">−</button>
      <input class="big" inputmode="decimal" data-precio="${i}" value="${Number(it.precio || 0).toFixed(2)}" aria-label="Precio en soles">
      <button type="button" data-act="mas" data-v="${i}" aria-label="Diez céntimos más">+</button></div>
    <select class="big" data-unidad="${i}" aria-label="Unidad">${UNIDADES.map((u) => `<option ${u === (it.unidad || (p && p.unidad) || "kilo") ? "selected" : ""}>${u}</option>`).join("")}</select></div>`;
}

function vManual() {
  const b = state.borrador || { items: [] };
  if (!b.items.length) return `<button class="back" ${b.volverFoto ? 'data-act="volver-foto"' : 'data-go="aportar"'}>‹ Atrás</button><h1>¿Qué producto?</h1>
    <div class="grid-prod">${PRODUCTOS.map((p) => `<button class="tile" data-act="elegir-manual" data-v="${p.id}"><span class="emo" aria-hidden="true">${p.emo}</span>${p.nombre}</button>`).join("")}</div>`;
  const ma = merc(state.mercadoActivo);
  return `${state.volverA === "semana" ? `<button class="back" data-go="semana">‹ Volver a mi lista</button>` : `<button class="back" data-act="ir-manual">‹ Otro producto</button>`}
    <div style="display:grid;gap:4px"><h1>¿A cuánto está?</h1>${ma ? `<p class="muted">En ${esc(ma.nombre)}</p>` : ""}</div>
    <div class="list">${editorItem(b.items[0], 0)}</div>
    <button class="btn" data-act="enviar-manual">Enviar precio</button>`;
}

function vNoHay() {
  const b = state.borrador || {};
  if (!b.producto) return `<button class="back" data-go="aportar">‹ Atrás</button><h1>¿Qué no encontraste?</h1>
    <div class="grid-prod">${PRODUCTOS.map((p) => `<button class="tile" data-act="elegir-nohay" data-v="${p.id}"><span class="emo" aria-hidden="true">${p.emo}</span>${p.nombre}</button>`).join("")}</div>`;
  const p = prod(b.producto);

    <div class="list"><button class="choice" data-act="enviar-nohay" data-v="no-hay" style="grid-template-columns:1fr"><span><b>No había</b><span>Ningún puesto lo tenía</span></span></button>
    <button class="choice" data-act="enviar-nohay" data-v="poco" style="grid-template-columns:1fr"><span><b>Había poco</b><span>Solo en uno o dos puestos</span></span></button></div>`;
}

function vGracias() {
  const u = state.ultimo || { n: 0, confirmado: true };

    <p class="pts">+${u.n} puntos</p>
    <p>${u.confirmado ? "Tu aporte ya se ve en el mercado." : "Tu aporte está en revisión. Los puntos se confirman cuando otra persona lo vea igual."}</p>

      : `<button class="btn" data-go="aportar">Aportar otro</button><button class="btn sec" data-go="inicio">Ver precios</button>`}`;
}

/* ---------------------------- mi semana: vistas ---------------------------- */
function vSemana() {
  if (state.perfil.rol === "resto") return vResto();
  if (!misMercados().length) return `<h1>Tu compra de la semana</h1><p class="muted">Primero elige tus mercados.</p>
    <button class="btn" data-act="editar-mercados">Elegir mercados</button>`;
  const paso = state.semPaso || (nPlatos() ? "lista" : "personas");
  return paso === "personas" ? semPersonas() : paso === "platos" ? semDias() : paso === "elegir" ? semElegir() : paso === "frutas" ? semFrutas() : semLista();
}

const numFs = (n) => (String(n).length >= 3 ? ' style="font-size:2.3rem"' : "");

function semPersonas() {
  const S = state.semana;
  return `${nPlatos() ? `<button class="back" data-act="sem-paso" data-v="lista">‹ Volver a mi lista</button>` : ""}
    <div style="display:grid;gap:6px"><h1>¿Para cuántas personas cocinas?</h1>
      <p class="muted">Te decimos qué comprar en la semana y cuánto te costará en tus mercados.</p></div>
    <div class="bigstep" role="group" aria-label="Personas">
      <button type="button" data-act="sem-per" data-v="-1" aria-label="Una persona menos" ${S.personas > 1 ? "" : "disabled"}>−</button>
      <output${numFs(S.personas)}>${S.personas}</output>
      <button type="button" data-act="sem-per" data-v="1" aria-label="Una persona más">+</button></div>
    <p style="text-align:center;margin-top:-8px" class="muted">${S.personas === 1 ? "persona" : "personas"}</p>
    <div class="chips wrap" role="group" aria-label="Elegir rápido">${[1, 2, 3, 4, 5, 6].map((n) => `
      <button class="chip" data-act="sem-per-fijo" data-v="${n}" aria-pressed="${S.personas === n}" style="min-width:52px">${n}</button>`).join("")}
      <button class="chip" data-act="sem-per-fijo" data-v="50" aria-pressed="${S.personas === 50}">Olla común: 50</button></div>
    <p class="note">Contamos la porción de una persona adulta. Dos niños pequeños cuentan como una persona.</p>
    <button class="btn" data-act="sem-paso" data-v="platos">Seguir</button>`;
}

/* Estado de la lectura de la foto del menú (casa o restaurante). */
function bloqueFotoMenu(boton) {
  const f = state.menuFoto;
  if (!f) return boton;
  if (f.estado === "leyendo") return `<div class="card" style="justify-items:center;text-align:center">${f.url ? `<img class="photo" src="${f.url}" alt="Tu foto del menú">` : ""}
    <div class="spin" role="progressbar" aria-label="Leyendo"></div><p class="status">Leyendo tu menú… tarda unos segundos.</p>
    <button class="btn quiet" data-act="menu-cancelar">Cancelar</button></div>`;
  if (f.estado === "lista") return `<div class="card" role="status"><h2>📷 Listo</h2><p>${esc(f.resumen)}</p>
    ${f.desconocidos.length ? `<p class="small muted">No tenemos receta de: ${esc(f.desconocidos.join(", "))}. Pronto podrás agregarlas.</p>` : ""}

  return `<p class="note" role="alert">${esc(f.error || "No se pudo leer la foto.")}</p>${boton}`;
}
const botonFotoMenu = (txt, ayuda) => (state.puedeFoto ? `<label class="btn sec" for="in-menu">📷 ${txt}</label>
  <input id="in-menu" class="sr" type="file" accept="image/*" capture="environment">
  <p class="small muted" style="margin-top:-8px">${ayuda}</p>` : "");

/* Paso 2: la semana día por día. */
function semDias() {
  const S = state.semana, llenos = diasLlenos();
  return `<button class="back" data-act="sem-paso" data-v="personas">‹ ${S.personas} ${S.personas === 1 ? "persona" : "personas"}</button>
    <div style="display:grid;gap:6px"><h1>¿Qué cocinarás cada día?</h1>
      <p class="muted">Elige el plato de cada día. Puedes dejar días vacíos.</p></div>
    ${bloqueFotoMenu(botonFotoMenu("Foto de tu menú de la semana", "Si lo tienes escrito en un papel o pizarra, la app llena los días por ti."))}
    ${state.aviso ? `<p class="note" role="status">${esc(state.aviso)}</p>` : ""}
    <div class="dias">${DIAS.map((x) => {
      const its = itemsDia(x.id);
      return `<div class="dia${its.length ? " on" : ""}"><b class="dn">${x.n}</b>
        <div class="dchips">${its.map((id) => { const d = plato(id); return `<span class="dchip"><span aria-hidden="true">${d.emo}</span> ${d.nombre}
          <button type="button" data-act="sem-quitar" data-v="${x.id}:${id}" aria-label="Quitar ${d.nombre} del ${x.n}">✕</button></span>`; }).join("")}
          ${its.length < 3 ? `<button type="button" class="dadd" data-act="sem-elegir" data-v="${x.id}">${its.length ? "+ Sopa, refresco u otro" : "+ Elegir plato"}</button>` : ""}</div></div>`;
    }).join("")}</div>
    ${llenos < 7 ? `<button class="btn sec" data-act="sem-economica">💡 Llenar los días vacíos con platos económicos</button>` : ""}
    ${llenos ? `<div class="stick"><button class="btn" data-act="sem-paso" data-v="lista">Ver mi canasta · ${llenos} de 7 días</button></div>`
      : `<p class="note">Elige al menos un día para ver tu canasta.</p>`}`;
}

/* Elegir un plato para un día: una sola decisión por pantalla. */
function semElegir() {
  const id = state.semDia, x = dia(id), its = itemsDia(id), tipo = state.semTipo || "segundo", ls = lugares();
  const tipos = TIPOS.filter((t) => t.id !== "fruta");
  return `<button class="back" data-act="sem-paso" data-v="platos">‹ Volver a la semana</button>
    <div style="display:grid;gap:6px"><h1 style="text-transform:none">${x.n[0].toUpperCase() + x.n.slice(1)}: ¿qué vas a cocinar?</h1>
      <p class="muted">Toca un plato y vuelves a tu semana.</p></div>
    <div class="chips wrap" role="group" aria-label="Tipo de plato">${tipos.map((t) => `
      <button class="chip" data-act="sem-tipo" data-v="${t.id}" aria-pressed="${tipo === t.id}">${t.nombre}</button>`).join("")}</div>
    <div class="opts">${PLATOS.filter((d) => d.tipo === tipo).map((d) => {
      const c = ls.map((L) => costoPlatoCon(d, (p) => precioLugar(p, L))).sort((a, b) => a.t - b.t)[0], on = its.includes(d.id);
      return `<button class="opt" data-act="sem-poner" data-v="${id}:${d.id}" aria-pressed="${on}">
        <span class="emo" aria-hidden="true">${d.emo}</span><span class="name">${d.nombre}</span>
        <span class="meta"><span>≈ ${soles(c.t)} ${tipoDe(d.tipo).por}</span>${c.riesgo >= 0.35 ? `<span class="pill up">Sube con El Niño</span>` : ""}</span>
        <span class="chk" aria-hidden="true">${on ? "✓" : ""}</span></button>`;
    }).join("")}</div>
    <p class="small muted">Precio por persona en el lugar más barato hoy (ejemplo).</p>`;
}

/* Frutas: sección aparte para no mezclar con los platos. */
function semFrutas() {
  const S = state.semana, ls = lugares();
  return `<button class="back" data-act="sem-paso" data-v="lista">‹ Volver a mi canasta</button>
    <div style="display:grid;gap:6px"><h1>Frutas de la semana</h1>
      <p class="muted">¿Cuántas por persona a la semana? Por ejemplo, 7 es una al día.</p></div>
    <div class="list">${PLATOS.filter((d) => d.tipo === "fruta").map((d) => {
      const v = S.frutas[d.id] || 0, c = ls.map((L) => costoPlatoCon(d, (p) => precioLugar(p, L)).t).sort((a, b) => a - b)[0];
      return `<div class="plato" data-on="${v > 0}"><span class="emo" aria-hidden="true">${d.emo}</span><b class="name">${d.nombre}</b>
        <div class="fila"><span class="meta"><span>≈ ${soles(c)} cada una</span></span>
          <span class="step" role="group" aria-label="${d.nombre}: por persona a la semana">
            <button type="button" data-act="fruta-menos" data-v="${d.id}" aria-label="Una menos" ${v ? "" : "disabled"}>−</button>
            <output>${v}</output>
            <button type="button" data-act="fruta-mas" data-v="${d.id}" aria-label="Una más ${d.nombre}">+</button></span></div></div>`;
    }).join("")}</div>
    <button class="btn" data-act="sem-paso" data-v="lista">Listo, volver a mi canasta</button>`;
}

function filaLista(it, mL) {
  const S = state.semana, pr = precioLugar(it.p, mL), tengo = !!S.tengo[it.p.id], compre = !!S.compre[it.p.id];
  const visto = mL.tipo !== "super" && precioHoy(it.p, mL).observado;
  const planear = S.modo !== "comprar", off = planear ? tengo : compre;
  return `<div class="lrow${off ? " off" : ""}">
    <span class="emo" aria-hidden="true">${it.p.emo}</span>
    <span class="nm"><b>${it.p.nombre}</b><br><span class="small">${cantTxt(it.p, it.compra)}</span><br>
      <span class="small muted">a ${soles(pr)} ${porUnidad(it.p)}${visto ? " · visto hoy" : ""}</span></span>
    <span class="pr">${planear && tengo ? "—" : soles(it.compra * pr)}</span>
    <span class="act">${planear
      ? `<button class="chip" data-act="sem-tengo" data-v="${it.p.id}" aria-pressed="${tengo}">${tengo ? "✓ Ya tengo" : "Ya tengo en casa"}</button>`
      : `<button class="chip" data-act="sem-compre" data-v="${it.p.id}" aria-pressed="${compre}">${compre ? "✓ Comprado" : "Lo compré"}</button>${compre && mL.tipo !== "super"
        ? `<button class="chip add" data-act="sem-reportar" data-v="${it.p.id}">¿A cuánto estaba? +${PUNTOS.manual}</button>` : ""}`}</span>
  </div>`;
}

/* Paso 3: la canasta. Primero el total y lo que te llevas en corto; el detalle, solo si lo pides. */
function semLista() {
  const S = state.semana, todos = compraSemana(), items = todos.filter((it) => !S.tengo[it.p.id]);
  const tot = totalesSemana(items), best = tot[0], worst = tot[tot.length - 1];
  const mL = mercLista(), planear = S.modo !== "comprar", llenos = diasLlenos();
  const combo = items.length && lugares().length > 1 ? mejorCombo(items) : null;
  const comboOk = combo && best.t - combo.t >= 5 && combo.asign[combo.a.id].length && combo.asign[combo.b.id].length;
  const riesgo = items.filter((it) => it.p.riesgo).map((it) => it.p.nombre.toLowerCase());
  const sug = sugerencias(best.m);
  const aparte = [...new Set(DIAS.flatMap((x) => itemsDia(x.id)).flatMap((id) => (plato(id) && plato(id).aparte) || []))];
  const falta = items.filter((it) => !S.compre[it.p.id]);
  const faltaT = r2(falta.reduce((a, it) => a + it.compra * precioLugar(it.p, mL), 0));
  const ocultos = todos.length - items.length;
  const frutas = Object.entries(S.frutas || {}).filter(([, n]) => n).map(([id, n]) => `${plato(id).nombre.replace(/ \(.*\)$/, "").toLowerCase()} ${n}`);
  const frutasT = items.filter((it) => it.p.rubro === "frutas").reduce((a, it) => a + it.compra * precioLugar(it.p, best.m), 0);
  const resumen = RUBROS.map((r) => {
    const its = items.filter((it) => it.p.rubro === r.id); if (!its.length) return "";
    const costo = (it) => it.compra * precioLugar(it.p, best.m), sub = its.reduce((a, it) => a + costo(it), 0);
    const top = [...its].sort((a, b) => costo(b) - costo(a)).slice(0, 3).map((it) => `${it.p.nombre.replace(/ \(.*\)$/, "").toLowerCase()} ${cantCorta(it.p, it.compra)}`);
    return `<div class="lleva"><span class="emo" aria-hidden="true">${r.emo}</span>
      <span><b>${r.corto}</b> <span class="muted">(${its.length})</span><br><span class="small muted">${esc(top.join(", "))}${its.length > 3 ? ` y ${its.length - 3} más` : ""}</span></span>
      <b class="pr">${soles(sub)}</b></div>`;
  }).join("");
  return `<div style="display:grid;gap:6px"><h1>Tu canasta de la semana</h1>
      <p class="muted">Para ${S.personas} ${S.personas === 1 ? "persona" : "personas"} · ${llenos} de 7 días con plato</p>
      <div style="display:flex;flex-wrap:wrap;gap:4px 12px"><button class="link" data-act="sem-paso" data-v="platos">Cambiar platos</button>
        <button class="link" data-act="sem-paso" data-v="personas">Cambiar personas</button></div></div>

    ${items.length ? `<div class="card" style="gap:8px">
      <span class="small muted">Lo más barato para toda tu canasta</span>
      <span class="tag big" style="justify-self:start"><span class="p">${soles(best.t)}</span></span>
      <p><b>en ${esc(best.m.tipo === "super" ? "el súper " + best.m.nombre : best.m.nombre)}</b><br><span class="muted">≈ ${soles(best.t / S.personas)} por persona a la semana</span></p></div>
    <div class="card"><h2>Lo que te llevas</h2>${resumen}
      <button class="btn quiet" data-act="sem-ver-lista">${state.semVerLista ? "Ocultar la lista" : "Ver la lista para ir a comprar"}</button></div>`
      : `<div class="card"><h2>Ya tienes todo en casa</h2><p class="muted">No hay nada que comprar con lo que elegiste.</p></div>`}

    ${state.semVerLista && todos.length ? `<div class="card"><h2>Tu lista</h2>
      <div class="seg" role="group" aria-label="Cómo usar la lista">
        <button type="button" data-act="sem-modo" data-v="planear" aria-pressed="${planear}">Antes de salir</button>
        <button type="button" data-act="sem-modo" data-v="comprar" aria-pressed="${!planear}">En el mercado</button></div>
      <p class="small muted">${planear ? "Marca lo que ya tienes en casa y no lo sumamos." : "Ve marcando lo que compras. Si nos dices a cuánto estaba, ganas puntos."}</p>
      <div><p class="lbl">Precios de:</p><div class="chips" role="group" aria-label="Lugar de la lista">${tot.map((x) => `
        <button class="chip" data-act="sem-merc" data-v="${x.m.id}" aria-pressed="${x.m.id === mL.id}">${esc(nombreLugar(x.m))}</button>`).join("")}</div></div>
      ${!planear ? `<p class="status">${falta.length ? `Te falta comprar ${falta.length} ${falta.length === 1 ? "cosa" : "cosas"}: ${soles(faltaT)}` : "¡Compraste todo!"}</p>` : ""}
      ${RUBROS.map((r) => { const its = todos.filter((it) => it.p.rubro === r.id && (planear || !S.tengo[it.p.id]));
        return its.length ? `<div class="grp"><h3>${r.nombre}</h3>${its.map((it) => filaLista(it, mL)).join("")}</div>` : ""; }).join("")}
      ${!planear && ocultos ? `<p class="small muted">No mostramos ${ocultos} ${ocultos === 1 ? "cosa que ya tienes" : "cosas que ya tienes"} en casa.</p>` : ""}
    </div>` : ""}

    ${items.length ? `<div class="card"><h2>¿Dónde te sale más barato?</h2>${tot.slice(0, state.semVerLugares ? tot.length : 3).map((x, i) => `
      <div class="mrow"><span><b>${esc(nombreLugar(x.m))}</b><br>
        <span class="small muted">${x.m.tipo === "super" ? (!x.reales ? "Súper · ejemplo" : x.reales === x.n ? `Súper · online del ${fechaCorta(state.superReal.fecha)}` : `Súper · online del ${fechaCorta(state.superReal.fecha)} en ${x.reales} de ${x.n} productos`) : "Mercado"}${x.vistos ? ` · ${x.vistos} precios vistos hoy` : ""}${i ? ` · ${soles(x.t - best.t)} más` : ""}</span>
        ${i === 0 ? `<br><span class="cheap">Más barato</span>` : ""}</span>
        <span class="tag"><span class="p">${soles(x.t)}</span></span></div>`).join("")}
      ${tot.length > 3 ? `<button class="btn quiet" data-act="sem-ver-lugares">${state.semVerLugares ? "Ver solo los 3 más baratos" : `Ver los ${tot.length} lugares`}</button>` : ""}
      ${comboOk ? (() => { const rb = rubrosDe(combo); return `<p>💡 <b>Combina y ahorra ${soles(best.t - combo.t)}:</b> ${esc(rb[combo.a.id].join(", ") || "algunas cosas")} en ${esc(nombreLugar(combo.a))}
        y ${esc(rb[combo.b.id].join(", ") || "lo demás")} en ${esc(nombreLugar(combo.b))}. Pagas ${soles(combo.t)}.</p>`; })()
        : worst.t - best.t >= 1 ? `<p>Ahorras <b>${soles(worst.t - best.t)}</b> si compras en ${esc(nombreLugar(best.m))} y no en ${esc(nombreLugar(worst.m))}.</p>` : ""}
      <p class="small muted">${state.superReal ? `Los súper marcados "online" usan el precio de su tienda virtual (${fechaCorta(state.superReal.fecha)}); en el local puede variar. Lo demás es de ejemplo.` : "Precios de ejemplo de tus mercados y de supermercados cercanos."}${limiteMercados() === GRATIS ? ` Con tus puntos puedes comparar hasta ${AMPLIADO} mercados.` : ""}</p></div>` : ""}

    <div class="card"><h2>🍎 Frutas de la semana</h2>
      ${frutas.length ? `<p>${esc(frutas.join(", "))} por persona · <b>${soles(frutasT)}</b> (ya sumado)</p>
        <button class="btn quiet" data-act="sem-paso" data-v="frutas">Cambiar frutas</button>`
        : `<p class="muted">Van aparte para no mezclar con los platos.</p><button class="btn sec" data-act="sem-paso" data-v="frutas">Agregar frutas</button>`}</div>

    ${best.r > 0 ? `<div class="alert" role="note"><span class="bang" aria-hidden="true">!</span>
      <span><b>${soles(best.r)} de tu canasta</b> (${Math.round((best.r / best.t) * 100)}%) puede subir por El Niño: ${esc(riesgo.join(", "))}.
      Si sube 20%, pagarías ${soles(best.t + best.r * 0.2)}.</span></div>` : ""}
    ${sug.map((s) => `<div class="card sug"><p>💡 Cambia <b>${esc(s.d.nombre.toLowerCase())}</b> por <b>${esc(s.alt.nombre.toLowerCase())}</b>:
      ahorras cerca de <b>${soles(s.ahorro)}</b> en la semana${s.evita.length ? ` y no dependes de ${esc(s.evita.join(" ni "))}` : ""}.</p>
      <button class="btn sec" data-act="sem-cambiar" data-v="${s.d.id}">Cambiar</button></div>`).join("")}

    <p class="note">No incluye: ${esc([...aparte, "sal y condimentos"].join(", "))}. Porciones caseras aproximadas, redondeadas a como se vende
      (cuarto, medio kilo). Precios de mercados y supermercados de ejemplo.</p>
    <button class="btn quiet" data-act="sem-limpiar">Empezar otra semana desde cero</button>
    <button class="btn sec" data-act="ir-ideas">💬 ¿Te sirvió? Danos tu opinión</button>`;
}

/* ---------------------------- plan restaurante: vistas ---------------------------- */
const sello = `<span class="prem">PLAN RESTAURANTE · PREMIUM GRATIS EN LA PRUEBA</span>`;
function vResto() {
  const paso = state.restoPaso || (diasConMenu().length ? "costos" : "negocio");
  return paso === "negocio" ? restoNegocio() : paso === "menu" ? restoMenu() : restoCostos();
}

function restoNegocio() {
  const R = state.resto;
  return `<div style="display:grid;gap:8px">${sello}<h1>Tu negocio</h1>
      <p class="muted">Con esto calculamos cuánto te cuesta cada menú y armamos el pedido para tus proveedores de siempre.</p></div>
    <div class="card"><p class="lbl">¿Cuántos menús vendes al día?</p>
      <div class="bigstep" role="group" aria-label="Menús al día">
        <button type="button" data-act="resto-menus" data-v="-1" aria-label="Cinco menús menos" ${R.menusDia > 5 ? "" : "disabled"}>−</button>
        <output${numFs(R.menusDia)}>${R.menusDia}</output>
        <button type="button" data-act="resto-menus" data-v="1" aria-label="Cinco menús más">+</button></div>
      <p class="small muted" style="text-align:center">menús al día (de 5 en 5)</p></div>
    <div class="card"><p class="lbl">¿Qué días atiendes?</p>
      <div class="chips wrap" role="group" aria-label="Días que atiendes">${DIAS.map((d) => `
        <button class="chip" data-act="resto-dia-on" data-v="${d.id}" aria-pressed="${R.dias.includes(d.id)}" style="min-width:64px">${d.c}</button>`).join("")}</div></div>
    <div class="card"><label class="lbl" for="rp-precio">¿A cuánto vendes el menú?</label>
      <div class="money"><button type="button" data-act="resto-precio" data-v="-1" aria-label="Cincuenta céntimos menos">−</button>
        <input class="big" id="rp-precio" inputmode="decimal" value="${R.precioMenu.toFixed(2)}" aria-label="Precio del menú en soles">
        <button type="button" data-act="resto-precio" data-v="1" aria-label="Cincuenta céntimos más">+</button></div></div>
    <button class="btn" data-act="resto-paso" data-v="menu" ${R.dias.length ? "" : "disabled"}>Seguir: arma tu menú de la semana</button>`;
}

function opcion(p, campo, on, multi) {
  const k = costoPlatoCon(p, precioResto);
  return `<button class="opt" data-act="${multi ? "resto-toggle" : "resto-unico"}" data-v="${campo}:${p.id}" aria-pressed="${on}">
    <span class="emo" aria-hidden="true">${p.emo}</span><span class="name">${p.nombre}</span>
    <span class="meta"><span>${soles(k.t)} por porción</span>${k.riesgo >= 0.35 ? `<span class="pill up">Sube con El Niño</span>` : ""}</span>
    <span class="chk" aria-hidden="true">${on ? "✓" : ""}</span></button>`;
}

function restoMenu() {
  const R = state.resto;
  if (!R.dias.includes(R.diaActivo)) R.diaActivo = R.dias[0];
  const d = R.diaActivo, x = diaMenu(d), c = costoDia(d), sig = siguienteDia(d), lleno = diasConMenu().length;
  const lista = (tipos, campo, multi) => PLATOS.filter((p) => tipos.includes(p.tipo))
    .map((p) => opcion(p, campo, multi ? x[campo].includes(p.id) : x[campo] === p.id, multi)).join("");
  const ninguno = (campo, txt) => `<button class="opt" data-act="resto-unico" data-v="${campo}:" aria-pressed="${!x[campo]}">
    <span class="emo" aria-hidden="true">–</span><span class="name">${txt}</span><span class="meta"></span><span class="chk" aria-hidden="true">${!x[campo] ? "✓" : ""}</span></button>`;
  return `<button class="back" data-act="resto-paso" data-v="negocio">‹ Tu negocio</button>
    <div style="display:grid;gap:6px">${sello}<h1>Menú de la semana</h1><p class="muted">${R.menusDia} menús al día a ${soles(R.precioMenu)}</p></div>
    ${bloqueFotoMenu(botonFotoMenu("Foto de tu pizarra de menú", "Sirve la del día o la de toda la semana. La app arma el menú por ti."))}
    <div class="chips wrap" role="group" aria-label="Día">${R.dias.map((id) => `
      <button class="chip" data-act="resto-dia" data-v="${id}" aria-pressed="${id === d}" style="min-width:64px">${dia(id).c}${diaMenu(id).segundo.length ? " ✓" : ""}</button>`).join("")}</div>
    <div class="card" style="gap:6px"><h2 style="text-transform:capitalize">${dia(d).n}</h2>
      <p>${c.lleno ? `Insumos por menú: <b>${soles(c.t)}</b> · <span class="semaf ${semaforo(c.t / R.precioMenu)}">${Math.round((c.t / R.precioMenu) * 100)}% del precio</span>` : "Marca al menos un segundo."}</p></div>
    <h2>Entrada</h2><p class="small muted" style="margin-top:-10px">Sopa, caldo o entrada fría. Puedes marcar varias.</p>
    <div class="opts">${lista(["sopa", "entrada"], "entrada", true)}</div>
    <h2>Segundo</h2><p class="small muted" style="margin-top:-10px">Puedes marcar varios.</p>
    <div class="opts">${lista(["segundo"], "segundo", true)}</div>
    <h2>Refresco</h2><div class="opts">${ninguno("refresco", "Sin refresco")}${lista(["refresco"], "refresco", false)}</div>
    <h2>Postre</h2><div class="opts">${ninguno("postre", "Sin postre")}${lista(["postre"], "postre", false)}</div>
    ${sig && c.lleno ? `<button class="btn quiet" data-act="resto-copiar-dia">Copiar este menú al ${dia(sig).n}</button>` : ""}
    <p class="small muted">Repartimos los menús del día en partes iguales entre las entradas y segundos que marques. Sumamos 5% de merma.
      Los precios son la referencia mayorista de ejemplo, o lo que te cobra tu proveedor si lo escribes en el pedido.</p>
    ${lleno ? `<div class="stick"><button class="btn" data-act="resto-paso" data-v="costos">Ver costos y pedido de la semana</button></div>` : ""}`;
}

function filaPedido(it) {
  const R = state.resto, ref = precioRef(it.p), mio = Number(R.precios[it.p.id]) || 0, pu = mio || ref;
  const dif = mio ? (mio - ref) / ref : 0;
  const pill = !mio ? "" : dif > 0.05 ? `<span class="pill up">${Math.round(dif * 100)}% sobre la referencia</span>`
    : dif < -0.05 ? `<span class="pill down">${Math.round(-dif * 100)}% bajo la referencia</span>` : `<span class="pill same">En precio</span>`;
  return `<div class="prow"><span class="emo" aria-hidden="true">${it.p.emo}</span>
    <span class="nm"><b>${it.p.nombre}</b><br><span class="small">${cantResto(it.p, it.compra)}</span></span>
    <span class="sub">${soles(it.compra * pu)}</span>
    <span class="inp"><label for="tp-${it.p.id}">Te cobra S/</label><input id="tp-${it.p.id}" inputmode="decimal" data-tprecio="${it.p.id}" value="${mio ? mio.toFixed(2) : ""}" placeholder="¿cuánto?"
      aria-describedby="rf-${it.p.id}"> <span>${POR_CORTO[it.p.unidad] || porUnidad(it.p)}</span>

}

function restoCostos() {
  const R = state.resto, ds = diasConMenu();
  if (!ds.length) return `<div style="display:grid;gap:8px">${sello}<h1>Tu semana en números</h1></div>
    <p class="muted">Primero arma el menú de al menos un día.</p><button class="btn" data-act="resto-paso" data-v="menu">Armar mi menú</button>`;
  const pd = ds.map((d) => ({ d, ...costoDia(d) }));
  const prom = pd.reduce((a, x) => a + x.t, 0) / pd.length, promR = pd.reduce((a, x) => a + x.r, 0) / pd.length;
  const fc = prom / R.precioMenu, sem = semaforo(fc);
  const gan = pd.reduce((a, x) => a + (R.precioMenu - x.t) * R.menusDia, 0);
  const items = compraResto(), total = items.reduce((a, it) => a + it.compra * precioResto(it.p), 0);
  const subida = promR * 0.2, sugerido = Math.ceil((R.precioMenu + subida) * 2) / 2;
  const caro = pd.reduce((a, x) => (x.t > a.t ? x : a));
  const sug = sugResto();
  const conPrecio = items.filter((it) => Number(R.precios[it.p.id]) > 0);
  const dif = conPrecio.reduce((a, it) => a + (precioResto(it.p) - precioRef(it.p)) * it.compra, 0);
  const baseRef = conPrecio.reduce((a, it) => a + precioRef(it.p) * it.compra, 0);
  const caros = conPrecio.map((it) => ({ it, d: (precioResto(it.p) - precioRef(it.p)) / precioRef(it.p) })).filter((x) => x.d > 0.05).sort((a, b) => b.d - a.d).slice(0, 3);
  const nombres = (d) => { const x = diaMenu(d); return [...x.entrada, ...x.segundo].map((id) => plato(id).nombre).join(", "); };
  const aparte = [...new Set(Object.keys(porcionesSemana()).flatMap((id) => plato(id).aparte || []))];
  return `<div style="display:grid;gap:6px">${sello}<h1>Tu semana en números</h1>
      <p class="muted">${ds.length} ${ds.length === 1 ? "día" : "días"} · ${R.menusDia} menús al día · ${soles(R.precioMenu)} el menú</p>
      <div style="display:flex;flex-wrap:wrap;gap:4px 12px"><button class="link" data-act="resto-paso" data-v="menu">Cambiar menú</button>
        <button class="link" data-act="resto-paso" data-v="negocio">Cambiar negocio</button></div></div>
    <div class="kpis">
      <div class="kpi ${sem}"><span class="small muted">Insumos por menú</span><b>${soles(prom)}</b>
        <span class="semaf ${sem}">${Math.round(fc * 100)}% · ${sem === "ok" ? "Bien" : sem === "warn" ? "Ajustado" : "Alto"}</span></div>
      <div class="kpi"><span class="small muted">Te queda por menú</span><b>${soles(R.precioMenu - prom)}</b><span class="small muted">para gas, personal y alquiler</span></div>
      <div class="kpi"><span class="small muted">Compra de la semana</span><b>${soles(total)}</b><span class="small muted">${ds.length * R.menusDia} menús</span></div>
      <div class="kpi"><span class="small muted">Te queda en la semana</span><b>${soles(gan)}</b><span class="small muted">antes de otros gastos</span></div>
    </div>
    <p class="small muted">En un menú económico, si los insumos pasan de la mitad del precio queda muy poco para gas, personal y alquiler.</p>
    <div class="card"><h2>Día por día</h2>${pd.map((x) => `
      <div class="drow"><span><b style="text-transform:capitalize">${dia(x.d).n}</b><br><span class="small muted">${esc(nombres(x.d))}</span></span>
        <span>${soles(x.t)}</span><span class="semaf ${semaforo(x.t / R.precioMenu)}">${Math.round((x.t / R.precioMenu) * 100)}%</span></div>`).join("")}
      ${pd.length > 1 ? `<p>Tu día más caro es el <b>${dia(caro.d).n}</b>.</p>` : ""}</div>
    ${promR > 0 ? `<div class="alert" role="note"><span class="bang" aria-hidden="true">!</span><span><b>${Math.round((promR / prom) * 100)}% del costo de tu menú</b>
      depende de productos que pueden subir por El Niño. Si suben 20%, cada menú te costaría ${soles(prom + subida)}.
      ${sugerido > R.precioMenu ? `Para ganar lo mismo, cobrarías ${soles(sugerido)}.` : "Tu precio aguanta esa subida."}</span></div>` : ""}
    ${sug.map((s) => `<div class="card sug"><p>💡 Cambia <b>${esc(s.d.nombre.toLowerCase())}</b> por <b>${esc(s.alt.nombre.toLowerCase())}</b>:
      ahorras cerca de <b>${soles(s.ahorro)}</b> en la semana${s.evita.length ? ` y no dependes de ${esc(s.evita.join(" ni "))}` : ""}.</p>
      <button class="btn sec" data-act="resto-cambiar" data-v="${s.d.id}">Cambiar en todo el menú</button></div>`).join("")}

    <div style="display:grid;gap:4px"><h2>Pedido para tus proveedores</h2>
      <p class="small muted">Ya incluye 5% de merma. Mientras no escribas tu precio, usamos la referencia mayorista (ref.). Escribe lo que te cobra tu proveedor y toca <b>Recalcular</b>: verás tu costo real y si te cobra justo.</p></div>
    ${PROVEEDORES.map((pv) => {
      const its = items.filter((it) => pv.rubros.includes(it.p.rubro)); if (!its.length) return "";
      const sub = its.reduce((a, it) => a + it.compra * precioResto(it.p), 0), texto = textoPedido(pv, its);
      return `<div class="card"><div><h2>${pv.emo} ${pv.nombre}</h2><p class="small muted">${pv.quien}</p></div>
        <div>${its.map(filaPedido).join("")}</div>
        <p class="status">Subtotal: ${soles(sub)}</p>
        <div class="row2"><a class="btn sec" href="https://wa.me/?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>
          <button class="btn quiet" data-act="resto-copiar" data-v="${pv.id}">Copiar pedido</button></div>
        ${state.copia && state.copia.id === pv.id ? `<textarea class="big" readonly aria-label="Pedido para copiar">${esc(state.copia.texto)}</textarea>
          <p class="small muted" role="status">${state.copia.ok ? "Copiado ✓ Pégalo en el chat de tu proveedor." : "Mantén presionado el texto para copiarlo."}</p>` : ""}</div>`;
    }).join("")}
    <button class="btn" data-act="resto-recalcular">Recalcular con mis precios</button>

    <div class="card"><h2>¿Tu proveedor te cobra justo?</h2>
      ${conPrecio.length ? `<p>${dif > 0.5 ? `En los ${conPrecio.length} productos con tu precio pagas <b>${soles(dif)} más</b> (${Math.round((dif / baseRef) * 100)}%) que la referencia mayorista esta semana.`
        : "Con los precios que escribiste, tus proveedores están en la referencia o por debajo. ¡Bien negociado!"}</p>
        ${caros.length ? `<p class="small">Para conversar con tu proveedor: ${caros.map((x) => `${esc(x.it.p.nombre.toLowerCase())} (+${Math.round(x.d * 100)}%)`).join(", ")}.</p>` : ""}
        <button class="btn sec" data-act="resto-aportar" ${R.aportadoDia === hoy() ? "disabled" : ""}>${R.aportadoDia === hoy() ? "Ya aportaste hoy ✓" : "Aportar mis precios (anónimo) · +10 puntos"}</button>
        <p class="small muted">Se publican sin tu nombre ni el de tu proveedor. Ayudan a que otros restaurantes negocien mejor.</p>`
      : `<p class="muted">Escribe en el pedido lo que te cobra tu proveedor y aquí verás si estás pagando de más.</p>`}</div>
    <p class="note">No incluye: ${esc([...aparte, "sal, condimentos y gas"].join(", "))}. Porciones de menú aproximadas; la referencia mayorista es de ejemplo
      (en la app real sale del boletín diario de precios mayoristas de Lima).</p>
    <button class="btn sec" data-act="ir-ideas">💬 ¿Te sirvió? Danos tu opinión</button>`;
}

    <div class="chips wrap" role="group" aria-label="Qué te pareció">${[["mal", "😕 No me sirvió"], ["bien", "🙂 Está bien"], ["super", "😍 Me encantó"]]
      .map(([v, t]) => chip("idea-nota", v, t, I.nota === v)).join("")}</div>
    <div><p class="lbl">¿Qué te sirvió más?</p><div class="chips wrap" role="group" aria-label="Lo más útil">${UTILES
      .filter((u) => esResto || !["Costos del menú", "Pedido al proveedor"].includes(u)).map((u) => chip("idea-util", u, u, I.util.includes(u))).join("")}</div></div>
    <div><p class="lbl">¿La usarías cada semana?</p><div class="chips wrap" role="group" aria-label="Frecuencia">${["Sí", "Tal vez", "No"]
      .map((v) => chip("idea-frec", v, v, I.frecuencia === v)).join("")}</div></div>
    ${esResto ? `<div><p class="lbl">Después de la prueba, ¿cuánto pagarías al mes por el plan restaurante?</p><div class="chips wrap" role="group" aria-label="Cuánto pagarías">${["Nada", "S/ 19", "S/ 29", "S/ 49 o más"]
      .map((v) => chip("idea-pago", v, v, I.pago === v)).join("")}</div></div>` : ""}
    <div><label class="lbl" for="idea-txt">¿Qué le agregarías o cambiarías?</label>
      <textarea class="big" id="idea-txt" maxlength="1000" placeholder="Escribe aquí tu idea…">${esc(I.texto)}</textarea></div>
    <p class="small muted">Tu opinión se guarda sin tu nombre.</p>
    <button class="btn" data-act="idea-enviar">Enviar mi opinión</button>`;
}

      <p class="small muted">${VERSION}</p></div>`;

function vPuesto() {

  if (!pu || state.borrador?.registro) {
    const r = state.borrador?.registro || { mercado: state.perfil.mercados[0] || MERCADOS[0].id, numero: "", rubros: [] };
    state.borrador = { registro: r };
    return `<h1>Registra tu puesto</h1><p class="muted">Así tus caseras ven tus precios con el nombre de tu puesto.</p>
      <div><label class="lbl" for="pu-mercado">Mercado</label><select class="big" id="pu-mercado">${MERCADOS.map((m) => `<option value="${m.id}" ${m.id === r.mercado ? "selected" : ""}>${esc(m.nombre)}</option>`).join("")}</select></div>
      <div><label class="lbl" for="pu-num">Número de puesto</label><input class="big" id="pu-num" inputmode="numeric" placeholder="Ejemplo: 45" value="${esc(r.numero)}"></div>
      <div><p class="lbl">¿Qué vendes?</p><div class="list">${RUBROS.map((x) => `
        <button class="choice" data-act="rubro" data-v="${x.id}" aria-pressed="${r.rubros.includes(x.id)}" style="grid-template-columns:1fr;min-height:64px"><span><b>${x.nombre}</b></span></button>`).join("")}</div></div>
      <button class="btn" data-act="guardar-puesto">Guardar mi puesto</button>`;
  }
  const m = merc(pu.mercado), mios = PRODUCTOS.filter((p) => pu.rubros.includes(p.rubro));

  const sinStock = state.borrador?.sinStock || {};
  state.borrador = { precios, sinStock };
  return `<div style="display:grid;gap:4px"><h1>Puesto ${esc(pu.numero)}</h1><p class="muted">${esc(m.nombre)}</p></div>
    <div class="alert" role="note"><span class="bang" aria-hidden="true">i</span><span>Cada mañana, actualiza tus precios en un minuto. Ganas ${PUNTOS.puesto} puntos y las caseras te encuentran.</span></div>
    ${state.puedeFoto ? `<button class="btn sec" data-act="ir-foto-puesto">${icono.foto} Mejor, tomo foto a mi pizarra</button>` : ""}
    <h2>Mis precios de hoy</h2>
    <div class="list">${mios.map((p) => `<div class="item"><div class="hd"><span>${p.emo} ${p.nombre} <span class="small muted">(${p.unidad === "kilo" ? "kilo" : p.unidad})</span></span>
        <button class="chip" data-act="sin-stock" data-v="${p.id}" aria-pressed="${!!sinStock[p.id]}" style="min-height:48px;font-size:0.8rem">${sinStock[p.id] ? "Hoy no tengo" : "Sí tengo"}</button></div>
      ${sinStock[p.id] ? "" : `<div class="money"><button type="button" data-act="pmenos" data-v="${p.id}" aria-label="Diez céntimos menos">−</button>
        <input class="big" inputmode="decimal" data-pprecio="${p.id}" value="${Number(precios[p.id]).toFixed(2)}" aria-label="Precio de ${p.nombre}">
        <button type="button" data-act="pmas" data-v="${p.id}" aria-label="Diez céntimos más">+</button></div>`}</div>`).join("")}</div>
    <button class="btn" data-act="publicar-puesto">Publicar mis precios</button>

    ${pu.publicado ? `<p class="small muted">Última publicación: ${esc(pu.publicado)}</p>` : ""}`;

/* ---------------------------- render y navegación ---------------------------- */
function render() {
  const v = state.view;
  document.documentElement.style.fontSize = (LETRAS.find((l) => l.id === state.perfil.letra) || LETRAS[0]).px + "px";
  const html = v === "bienvenida" ? vBienvenida() : v === "inicio" ? vInicio() : v === "producto" ? vProducto(state.productoActivo)
    : v === "aportar" ? vAportar() : v === "foto" ? vFoto() : v === "manual" ? vManual() : v === "nohay" ? vNoHay()
    : v === "gracias" ? vGracias() : v === "puntos" ? vPuntos() : v === "puesto" ? vPuesto() : v === "semana" ? vSemana()
    : v === "ideas" ? vIdeas() : vInicio();
  $("#main").innerHTML = html;
  state.aviso = null;
  const enApp = v !== "bienvenida" && !(v === "ideas" && state.desde === "bienvenida");
  $("#bar").hidden = !enApp;
  if (enApp) document.documentElement.style.setProperty("--nav-h", $("#bar").offsetHeight + "px");
  const esPuesto = state.perfil.rol === "puesto";
  $("#nav-aportar-txt").textContent = esPuesto ? "Mi puesto" : "Aportar";
  $("#nav-semana-txt").textContent = state.perfil.rol === "resto" ? "Mi menú" : "Mi semana";
  const im = $("#in-menu"); if (im) im.addEventListener("change", (e) => leerMenu(e, state.perfil.rol === "resto" ? "resto" : "casa"));
  if (state.toast) { toast(state.toast); state.toast = null; }
  let tab = { inicio: "inicio", producto: "inicio", aportar: "aportar", foto: "aportar", manual: "aportar", nohay: "aportar", gracias: "aportar", puesto: "aportar", puntos: "puntos", semana: "semana" }[v];
  if (state.volverA === "semana" && (v === "manual" || v === "gracias")) tab = "semana";
  ["inicio", "semana", "aportar", "puntos"].forEach((t) => { const b = $("#nav-" + t); if (t === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const foto = $("#in-foto"); if (foto) foto.addEventListener("change", leerFoto);
  const sd = $("#sel-distrito"); if (sd) sd.addEventListener("change", (e) => { state.perfil.distrito = e.target.value; render(); });
}
function ir(view) {
  if (view === "aportar" && state.perfil.rol === "puesto") view = "puesto";
  if (["aportar", "puesto", "inicio", "puntos", "semana"].includes(view)) { state.borrador = null; state.volverA = null; }
  if (view === "semana") { state.semPaso = nPlatos() ? "lista" : "personas"; state.restoPaso = null; state.menuFoto = null; state.copia = null; }
  state.view = view; render(); window.scrollTo(0, 0); enfocarTitulo();
}
let tToast = null;
function toast(t) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.textContent = t; el.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => { el.hidden = true; }, 4500);
}
/* Al cambiar de pantalla, el lector de pantalla empieza por el título. */
function enfocarTitulo() { const h = $("#main h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
const avisarSR = (t) => { const s = $("#sr"); s.textContent = ""; setTimeout(() => { s.textContent = t; }, 30); };

/* ---------------------------- foto de pizarra ---------------------------- */
let ctl = null;
async function leerFoto(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  state.borrador = { estado: "leyendo", url, fuente: state.borrador?.fuente || "foto", items: [] };
  render();
  ctl = new AbortController();
  const catalogo = PRODUCTOS.map((p) => p.nombre.toLowerCase()).join(", ");
  try {
    const res = await state.sample.json(
      "La imagen es una foto de la pizarra o cartel de precios de un puesto en un mercado de Lima, Perú. " +
      "Extrae cada producto con su precio en soles. Usa estos nombres cuando corresponda: " + catalogo + ". " +
      'Responde solo un arreglo JSON como [{"producto":"limón","precio":4.5,"unidad":"kilo"}]. ' +
      "La unidad es una de: " + UNIDADES.join(", ") + " (si no se ve, usa kilo). Si no se lee ningún precio, responde [].",
      { images: [file], modelTier: "quick", signal: ctl.signal });
    const items = (Array.isArray(res) ? res : []).map((r) => {

/* ---------------------------- foto del menú (casa o restaurante) ---------------------------- */
function diaDe(t) { const n = norm(t); return n ? DIAS.find((d) => norm(d.n) === n || norm(d.c) === n.slice(0, 3)) : null; }
function platoDe(pl) {
  let d = plato(pl && pl.id);
  if (!d && pl && pl.nombre) { const n = norm(pl.nombre); d = n.length >= 4 && PLATOS.find((x) => norm(x.nombre) === n || norm(x.nombre).includes(n) || n.includes(norm(x.nombre).replace(/ \(.*\)$/, ""))); }
  return d || null;
}
async function leerMenu(e, modo) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  state.menuFoto = { estado: "leyendo", url: URL.createObjectURL(file) };
  render();
  ctl = new AbortController();
  const catalogo = PLATOS.filter((d) => d.tipo !== "fruta").map((d) => `${d.id}: ${d.nombre}`).join("; ");
  try {
    const res = await state.sample.json(
      "La imagen es una foto de una pizarra, cartel o cuaderno con el menú " + (modo === "resto" ? "de un restaurante de menú" : "de comidas de una familia") + " en Perú. " +
      "Puede ser de un solo día o de toda la semana. Recetario (id: nombre): " + catalogo + ". " +
      'Responde solo JSON con esta forma: {"dias":[{"dia":"lunes","platos":[{"id":"arroz-pollo","nombre":"Arroz con pollo","tipo":"segundo"}]}]}. ' +
      'En "dia" usa lunes, martes, miercoles, jueves, viernes, sabado o domingo; si la foto no dice el día, usa null. ' +
      'En "id" pon el id del recetario que corresponde al plato, o null si ninguno se parece. "tipo" es entrada, sopa, segundo, refresco o postre. ' +
      'Si no se lee ningún plato, responde {"dias":[]}.',
      { images: [file], modelTier: "quick", signal: ctl.signal });
    const dias = Array.isArray(res && res.dias) ? res.dias : [];
    const desconocidos = new Set(); let nPl = 0, nDias = 0;
    const leidos = dias.map((x) => ({ dia: diaDe(x && x.dia), platos: (Array.isArray(x && x.platos) ? x.platos : []).map((pl) => {
      const d = platoDe(pl); if (d) nPl++; else if (pl && pl.nombre) desconocidos.add(String(pl.nombre).slice(0, 40)); return d; }).filter(Boolean) }))
      .filter((x) => x.platos.length);
    if (modo === "resto") {
      const R = state.resto; state.menuPrevio = { modo, menu: structuredClone(R.menu), dias: [...R.dias] };
      for (const x of leidos) {
        const id = x.dia ? x.dia.id : R.diaActivo;
        if (!R.dias.includes(id)) R.dias = DIAS.map((d) => d.id).filter((d) => d === id || R.dias.includes(d));
        const m = { entrada: [], segundo: [], refresco: null, postre: null };
        for (const d of x.platos) {
          if (d.tipo === "segundo" && !m.segundo.includes(d.id)) m.segundo.push(d.id);
          else if ((d.tipo === "sopa" || d.tipo === "entrada") && !m.entrada.includes(d.id)) m.entrada.push(d.id);
          else if (d.tipo === "refresco") m.refresco = m.refresco || d.id;

      if (leidos.length && !leidos.some((x) => x.dia)) nDias = 1;
      guardarResto();
    } else {
      /* Con día: va a ese día. Sin día: cada plato principal ocupa el siguiente día vacío. */
      const S = state.semana; state.menuPrevio = { modo, dias: structuredClone(S.dias) };
      const dias = { ...S.dias }, vacio = () => DIAS.find((x) => !(dias[x.id] || []).length);
      for (const x of leidos) {
        const comidas = x.platos.filter((d) => d.tipo !== "fruta");
        if (x.dia) { dias[x.dia.id] = [...new Set(comidas.map((d) => d.id))].slice(0, 3); nDias++; continue; }
        for (const d of comidas) { if (d.tipo === "refresco" || d.tipo === "postre") continue; const v = vacio(); if (!v) break; dias[v.id] = [d.id]; nDias++; }
      }
      if (nPl) S.dias = dias;
