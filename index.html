<title>Acuánto</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
  /* Layout: app de una columna (máx. 480px) con cabecera fija arriba y barra de 3 botones grandes abajo.
     Lo memorable: los precios en etiquetas de cartón como las pizarras del mercado. Todo lo demás, sobrio y grande. */
  :root {
    --bg: #f3f6f1;
    --surface: #ffffff;
    --ink: #17201a;
    --muted: #4b5a50;
    --line: #d3dcd1;
    --green: #0b6b3a;
    --green-ink: #ffffff;
    --green-soft: #e1f2e7;
    --red: #b42318;
    --red-soft: #fde7e3;
    --same: #46555f;
    --same-soft: #e7ecef;
    --kraft: #dcb77d;
    --kraft-ink: #26180a;
    --yellow: #ffd60a;
    --yellow-ink: #1d1a00;
    --alert-bg: #fff3bf;
    --alert-ink: #3d3100;
    --amber: #8a5300;
    --viz-up: #e34948; --viz-down: #2a78d6;
    --viz-1: #2a78d6; --viz-2: #eb6834; --viz-3: #1baf7a; --viz-4: #eda100; --viz-5: #e87ba4;
    --font-brand: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1410; --surface: #19211b; --ink: #eef3ee; --muted: #b5c2b8; --line: #2d382f;
      --green: #4cc584; --green-ink: #062012; --green-soft: #143222; --red: #ff8b76; --red-soft: #3b1712;
      --same: #b3c3cd; --same-soft: #26313a; --kraft: #c9a46b; --kraft-ink: #1f1308;
      --alert-bg: #3a3205; --alert-ink: #fff0a8; --amber: #f0b45a; color-scheme: dark;
      --viz-up: #e66767; --viz-down: #3987e5; --viz-1: #3987e5; --viz-2: #d95926; --viz-3: #199e70; --viz-4: #c98500; --viz-5: #d55181;
    }
  }
  :root[data-theme="dark"] {
    --viz-up: #e66767; --viz-down: #3987e5; --viz-1: #3987e5; --viz-2: #d95926; --viz-3: #199e70; --viz-4: #c98500; --viz-5: #d55181;
    --bg: #0f1410; --surface: #19211b; --ink: #eef3ee; --muted: #b5c2b8; --line: #2d382f;
    --green: #4cc584; --green-ink: #062012; --green-soft: #143222; --red: #ff8b76; --red-soft: #3b1712;
    --same: #b3c3cd; --same-soft: #26313a; --kraft: #c9a46b; --kraft-ink: #1f1308;
    --alert-bg: #3a3205; --alert-ink: #fff0a8; --amber: #f0b45a; color-scheme: dark;
  }
  html { font-size: 19px; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
         -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--green); }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--green); color: var(--green-ink);
               padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
               padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: grid; gap: 0; min-width: 0; }
  .brand b { font-family: var(--font-brand); font-weight: 400; font-size: 1.45rem; line-height: 1.05; letter-spacing: 0.01em; }
  .brand span { font-size: 0.78rem; opacity: 0.92; }
  .aa { min-width: 56px; min-height: 52px; border-radius: 12px; border: 2px solid currentColor; background: transparent;
        color: var(--green-ink); font-weight: 700; font-size: 1rem; padding: 0 10px; }

  main { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 16px 128px; display: grid; gap: 18px; align-content: start; }
  h1, h2 { margin: 0; line-height: 1.2; text-wrap: balance; }
  h1 { font-size: 1.55rem; }
  h2 { font-size: 1.2rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  /* Botones grandes */
  .btn { min-height: 60px; border-radius: var(--radius); border: 2px solid var(--green); background: var(--green); color: var(--green-ink);
         font-weight: 700; font-size: 1.05rem; padding: 12px 18px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .btn.sec { background: var(--surface); color: var(--green); }
  .btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .back { justify-self: start; min-height: 52px; padding: 0 14px 0 6px; border: none; background: transparent; color: var(--green);
          font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 4px; }

  /* Tarjetas de opción */
  .choice { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%;
            min-height: 92px; padding: 14px 16px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); }
  .choice[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
  .choice .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 1.6rem; }
  .choice b { display: block; font-size: 1.1rem; }
  .choice span { color: var(--muted); font-size: 0.9rem; }

  /* Chips de mercados */
  .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chip { flex: 0 0 auto; min-height: 52px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface);
          font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.add { border-style: dashed; color: var(--green); }

  .alert { background: var(--alert-bg); color: var(--alert-ink); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .alert .bang { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
  .note { border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--muted); font-size: 0.88rem; }

  /* Fila de producto con etiqueta de cartón */
  .list { display: grid; gap: 12px; }
  .prod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "emo name tag" "meta meta meta"; gap: 6px 12px; align-items: center; width: 100%; text-align: left;
          background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .prod .emo { grid-area: emo; } .prod .name { grid-area: name; } .prod .tag { grid-area: tag; }
  .prod .meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .prod .emo { font-size: 2rem; line-height: 1; text-align: center; }
  .prod .name { font-weight: 700; font-size: 1.15rem; }
  .prod .src { font-size: 0.82rem; color: var(--muted); }
  .tag { background: var(--kraft); color: var(--kraft-ink); border-radius: 6px; padding: 6px 10px 4px; text-align: right; transform: rotate(-1.5deg);
         box-shadow: 0 2px 0 rgba(0,0,0,0.12); min-width: 104px; }
  .tag .p { font-weight: 700; font-size: 1.45rem; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag .u { font-size: 0.78rem; }
  .tag.big .p { font-size: 2.2rem; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 0.85rem; border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
  .pill.up { background: var(--red-soft); color: var(--red); }
  .pill.pop { background: var(--alert-bg); color: var(--alert-ink); }
  .pill.fit { background: var(--green-soft); color: var(--green); }
  .kcal { flex-basis: 100%; font-size: 0.82rem; color: var(--muted); }
  .opt[disabled] { opacity: 0.5; }
  .pill.down { background: var(--green-soft); color: var(--green); }
  .pill.same { background: var(--same-soft); color: var(--same); }
  .cheap { display: inline-block; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: 0.85rem; border-radius: 6px; padding: 2px 8px; }

  .card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: none; }

  /* Formularios */
  label.lbl { font-weight: 700; display: block; margin-bottom: 6px; }
  select.big, input.big { width: 100%; min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 1.1rem; }
  .money { display: grid; grid-template-columns: 60px minmax(0, 1fr) 60px; gap: 8px; align-items: center; }
  .money button { min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; font-weight: 700; }
  .money input { text-align: center; font-weight: 700; font-size: 1.5rem; }
  .grid-prod { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { min-height: 96px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; gap: 4px; padding: 10px; font-weight: 700; text-align: center; }
  .tile .emo { font-size: 2rem; line-height: 1; }
  .tile[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
  .item { display: grid; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .item .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .x { min-width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-weight: 700; }
  .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius); border: 2px solid var(--line); }
  .status { font-weight: 700; }

  /* Puntos */
  .points { text-align: center; display: grid; gap: 4px; padding: 20px 16px; }
  .points .n { font-family: var(--font-brand); font-size: 3rem; line-height: 1; color: var(--green); }
  .reward { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .reward .btn { width: auto; min-width: 128px; min-height: 52px; font-size: 0.95rem; }
  .hist { display: grid; gap: 6px; font-size: 0.9rem; }
  .hist div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 6px 0; }

  .done { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 24px; }
  .done .ok { width: 96px; height: 96px; border-radius: 50%; background: var(--green); color: var(--green-ink); display: grid; place-items: center; font-size: 3rem; font-weight: 700; }
  .done .pts { font-family: var(--font-brand); font-size: 2rem; color: var(--green); }

  /* Barra inferior */
  nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.bar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px; padding: 8px 6px; }
  nav.bar button { min-height: 64px; min-width: 0; border: none; background: transparent; border-radius: 14px; display: grid; justify-items: center; align-content: center; gap: 2px;
                   font-weight: 700; font-size: 0.8rem; line-height: 1.1; text-align: center; padding: 4px 2px; color: var(--muted); }
  nav.bar button svg { width: 28px; height: 28px; }
  nav.bar button[aria-current="page"] { color: var(--green); background: var(--green-soft); }
  nav.bar button.main { background: var(--green); color: var(--green-ink); }
  nav.bar button.main[aria-current="page"] { outline: 3px solid var(--yellow); }
  /* Registro opcional */
  .consent { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.95rem; }
  .consent input { width: 28px; height: 28px; margin: 2px 0 0; accent-color: var(--green); }
  /* Historial: calendario */
  .cal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-h { text-align: center; font-weight: 700; font-size: 0.8rem; color: var(--muted); }
  .cal-d { min-height: 56px; border-radius: 10px; background: var(--bg); display: grid; justify-items: center; align-content: start; gap: 2px; padding: 4px 1px; font-size: 0.8rem; min-width: 0; }
  .cal-d.vacio { background: transparent; }
  .cal-d.on { background: var(--green-soft); }
  .cal-d.hoy { box-shadow: inset 0 0 0 2px var(--green); }
  .cal-d .n { color: var(--muted); font-weight: 700; }
  .cal-d .e { font-size: 1.15rem; line-height: 1; }
  .cal-d .e .emo2 { transform: scale(0.8); }
  .cal-d .mas { font-size: 0.72rem; font-weight: 700; color: var(--green); }
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hrow:last-child { border-bottom: none; }
  /* Alzas: barras divergentes (rojo sube, azul baja) y líneas por cadena. Colores validados con dataviz. */
  .ab { display: grid; gap: 6px; }
  .ab-row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 8fr) 58px; gap: 8px; align-items: center; border-radius: 8px; padding: 2px 0; }
  .ab-row:hover, .ab-row:focus-visible { background: var(--bg); }
  .ab-n { font-size: 0.88rem; line-height: 1.2; overflow-wrap: anywhere; }
  .ab-t { position: relative; height: 16px; }
  .ab-t::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
  .ab-b { position: absolute; top: 1px; height: 14px; }
  .ab-b.up { background: var(--viz-up); border-radius: 0 4px 4px 0; }
  .ab-b.down { background: var(--viz-down); border-radius: 4px 0 0 4px; }
  .ab-v { font-weight: 700; font-size: 0.88rem; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); align-items: center; }
  .leg .k { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .leg .k.up { background: var(--viz-up); } .leg .k.down { background: var(--viz-down); }
  .leg .kl { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 4px; }
  .viz { width: 100%; height: auto; display: block; overflow: visible; }
  .viz .gl { stroke: var(--line); stroke-width: 1; }
  .viz .tk { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .viz .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .viz .dot { stroke: var(--surface); stroke-width: 2; }
  .viz .el { fill: var(--ink); font-size: 10px; font-weight: 700; }
  .viz .xh { stroke: var(--muted); stroke-width: 1; }
  .s1 { stroke: var(--viz-1); } .f1 { fill: var(--viz-1); background: var(--viz-1); }
  .s2 { stroke: var(--viz-2); } .f2 { fill: var(--viz-2); background: var(--viz-2); }
  .s3 { stroke: var(--viz-3); } .f3 { fill: var(--viz-3); background: var(--viz-3); }
  .s4 { stroke: var(--viz-4); } .f4 { fill: var(--viz-4); background: var(--viz-4); }
  .s5 { stroke: var(--viz-5); } .f5 { fill: var(--viz-5); background: var(--viz-5); }
  .vtip { position: relative; min-height: 1.4em; font-size: 0.88rem; }
  .vtip b { font-variant-numeric: tabular-nums; }
  .causa { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .causa:last-child { border-bottom: none; }
  .causa .emo { font-size: 1.5rem; text-align: center; }
  table.tv { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.tv th, table.tv td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.tv td:last-child, table.tv th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  details > summary { cursor: pointer; font-weight: 700; color: var(--green); min-height: 44px; display: flex; align-items: center; }
  .spin { width: 40px; height: 40px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--green); animation: rot 0.9s linear infinite; justify-self: center; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1:focus { outline: none; }
  /* Las rejillas no crecen con el contenido: las tiras de chips se desplazan dentro de su caja. */
  main, .card, .list, .grp { grid-template-columns: minmax(0, 1fr); }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chips.wrap .chip { white-space: normal; max-width: 100%; text-align: left; }
  .grp-t { font-size: 1rem; color: var(--muted); margin-top: 6px; }

  /* Mi semana */
  .bigstep { display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; gap: 12px; align-items: center; }
  .bigstep button { min-height: 80px; border-radius: 18px; border: 2px solid var(--green); background: var(--surface); color: var(--green); font-size: 2.2rem; font-weight: 700; }
  .bigstep output { text-align: center; font-family: var(--font-brand); font-size: 3.2rem; line-height: 1; color: var(--green); font-variant-numeric: tabular-nums; }
  .plato { display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-areas: "emo name" "emo fila"; gap: 6px 12px; align-items: center;
           background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .plato[data-on="true"] { border-color: var(--green); background: var(--green-soft); }
  .plato .emo { grid-area: emo; font-size: 2rem; line-height: 1; text-align: center; align-self: start; padding-top: 2px; }
  .plato .name { grid-area: name; font-size: 1.12rem; }
  .plato .fila { grid-area: fila; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .plato .meta { flex: 1 1 110px; font-size: 0.88rem; color: var(--muted); display: grid; gap: 4px; justify-items: start; }
  .step { display: inline-grid; grid-template-columns: 52px minmax(2.2ch, auto) 52px; gap: 6px; align-items: center; margin-left: auto; }
  .step button { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; font-weight: 700; color: var(--ink); }
  .step button[disabled] { opacity: 0.4; cursor: not-allowed; }

  const ref = puntoLista(), n = 6 + (state.verMas || 0);

      <div><label class="lbl" for="sel-distrito">${state.ubic && !state.verDistrito ? "¿Compras en otro distrito?" : "Distrito"}</label>
        <select class="big" id="sel-distrito">${listaDistritos().map((d) => `<option ${d === p.distrito ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div></div>

    <div style="display:grid;gap:8px"><h2>Supermercados ${state.ubic ? "cerca de ti" : "para comparar"}</h2>

        return `<button class="chip" data-act="super" data-v="${x.id}" aria-pressed="${on}">${on ? "✓ " : ""}${esc(x.nombre)}${b ? (state.ubic ? " · " + fmtDist(b.d) : b.d < 6000 ? " · " + esc(b.s.distrito) : "") : ""}</button>`; }).join("")}</div>
      ${state.ubic ? `<p class="small muted">${supers.filter(({ x, b }) => b && (p.supers || []).includes(x.id)).map(({ x, b }) => `${esc(x.nombre)}: ${esc(b.s.sede ? b.s.sede + ", " : "")}${esc(b.s.distrito)}`).join(" · ")}</p>` : ""}</div>

    ${hayLugares ? `<p class="small muted">Mercados y tiendas: © colaboradores de OpenStreetMap. Precios de ejemplo hasta que la gente reporte los reales.</p>` : ""}
    <p class="small muted">Tus aportes se publican sin tu nombre y tu número no se comparte. Al seguir aceptas el uso de tus aportes para calcular precios (Ley 29733).</p>
    <button class="btn" data-act="empezar" ${p.mercados.length ? "" : "disabled"}>Empezar</button>`;

function filaMercado(m, d) {
  const on = state.perfil.mercados.includes(m.id);
  return `<button class="choice" data-act="mercado" data-v="${esc(m.id)}" aria-pressed="${on}" style="grid-template-columns:1fr auto;min-height:72px">
    <span><b>${esc(m.nombre)}</b><span>${esc(m.distrito)}${d != null ? " · " + fmtDist(d) : ""}${m.propio ? " · lo agregaste tú" : ""}</span></span>
    <span aria-hidden="true" style="font-size:1.5rem">${on ? "✔" : "＋"}</span></button>`;
}
function resultadosMerc() {
  const q = (state.qMerc || "").trim();
  if (norm(q).length < 2 || state.nuevoMerc) return "";
  const rs = buscarMercados(q), zs = buscarZonas(q);
  const filasZona = zs.map((z) => `<button class="choice" data-act="zona" data-v="${esc(z.nombre)}" style="grid-template-columns:1fr auto;min-height:64px">
      <span><b>📍 Mercados cerca de ${esc(z.nombre)}</b><span>${esc(z.distrito)}</span></span><span aria-hidden="true" style="font-size:1.4rem">›</span></button>`).join("");
  if (zs.length && !rs.length) return `<div class="list">${filasZona}</div>`;
  return rs.length
    ? `<div class="list">${filasZona}${rs.map((r) => filaMercado(r.m, distLugar(r.m))).join("")}</div>
      <p class="small muted">¿No está el tuyo? <button class="link" data-act="merc-nuevo">Agregar «${esc(q)}»</button></p>`
    : `<p class="muted">No encontramos «${esc(q)}».</p><button class="btn sec" data-act="merc-nuevo">Agregar mi mercado</button>`;
}
function formNuevoMerc() {
  const x = state.nuevoMerc;
  if (!x) return "";
  return `<div class="card" style="gap:10px"><h2>Agregar mi mercado</h2>
    <div><label class="lbl" for="nm-nombre">Nombre del mercado</label>
      <input class="big" id="nm-nombre" maxlength="60" autocomplete="off" value="${esc(x.nombre)}" placeholder="Ej. Mercado Santa Rosa"></div>
    <div><label class="lbl" for="nm-distrito">Distrito</label>
      <select class="big" id="nm-distrito">${listaDistritos().map((d) => `<option ${d === x.distrito ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
    ${x.error ? `<p class="note" role="alert">${esc(x.error)}</p>` : ""}
    <p class="small muted">Lo agregamos para ti con precios estimados de la zona; cuando reporten precios de ahí, se vuelven reales. También nos llega el nombre para sumarlo a la lista de todos.</p>

function filaProducto(p, m) {
  const h = precioHoy(p, m), antes = semanaPasada(p, m), d = r10(h.precio - antes);
  const est = d > 0.05 ? `<span class="pill up">▲ Subió ${soles(d)}</span>` : d < -0.05 ? `<span class="pill down">▼ Bajó ${soles(-d)}</span>` : `<span class="pill same">= Igual</span>`;
  const src = h.observado ? `${h.n} ${h.n === 1 ? "persona lo vio" : "personas lo vieron"} hoy · ${hora(h.ult)}${h.puesto ? " · incluye puesto" : ""}` : "Estimado de ejemplo";
  const otros = lugares().filter((o) => o.id !== m.id).map((o) => ({ o, x: precioLugar(p, o) })).sort((a, b) => a.x - b.x);
  const barato = otros.length && otros[0].x <= h.precio - 0.3 ? `<span class="cheap">Más barato en ${esc(nombreLugar(otros[0].o))}: ${soles(otros[0].x)}</span>` : "";
  const e = estadoProd(p, m), sub = (e.caro || e.escaso) ? sustitutos(p, m).find((x) => x.ahorro > 0.1) : null;
  const pista = sub ? `<span class="hint">💡 Prueba ${esc(sub.s.nombre.toLowerCase())}</span>` : "";
  const falta = escasez(p, m) ? `<span class="pill up">Reportan que no hay</span>` : "";
  return `<button class="prod" data-act="producto" data-v="${p.id}">
    <span class="emo" aria-hidden="true">${emoP(p)}</span>
    <span class="name">${p.nombre}</span>
    <span class="tag"><span class="p">${soles(h.precio)}</span><br><span class="u">${porUnidad(p)}</span></span>
    <span class="meta">${est} ${falta} ${barato} ${pista}<span class="src">${src}</span></span>
  </button>`;
}

function chipsMercados() {
  const ms = misMercados();
  return `<div class="chips" role="group" aria-label="Tus mercados">${ms.map((m) => `
    <button class="chip" data-act="activo" data-v="${m.id}" aria-pressed="${m.id === state.mercadoActivo}">${esc(m.nombre.replace("Mercado ", ""))}</button>`).join("")}
    <button class="chip add" data-act="editar-mercados">+ Mercados</button></div>`;
}

function vInicio() {
  const m = merc(state.mercadoActivo);
  if (!m) return `<p>Elige un mercado para empezar.</p><button class="btn" data-act="editar-mercados">Elegir mercados</button>`;

  const observados = PRODUCTOS.filter((p) => precioHoy(p, m).observado).length;
  let semanaBtn;
  if (state.perfil.rol === "resto") {
    const ds = diasConMenu(), prom = ds.length ? ds.reduce((a, d) => a + costoDia(d).t, 0) / ds.length : 0;
    semanaBtn = `<button class="btn sec" data-go="semana">🍲 ${ds.length ? `Tu menú: ${soles(prom)} de insumos (${Math.round((prom / state.resto.precioMenu) * 100)}% del precio)` : "¿Cuánto te cuesta tu menú? Calcúlalo"}</button>`;

    <div class="alert" role="note"><span class="bang" aria-hidden="true">!</span>
      <span><b>Por El Niño pueden subir:</b> ${riesgo.join(", ")}. Compra lo que necesitas y compara antes.</span></div>

      <p class="muted small">${observados ? `${observados} de ${PRODUCTOS.length} precios vistos hoy por la gente` : "Aún nadie aportó hoy aquí. Los precios son estimados de ejemplo."}</p></div>
    ${observados ? "" : `<button class="btn sec" data-go="aportar">📷 Sé la primera: foto a una pizarra, +${PUNTOS.foto} puntos</button>`}
    <div class="chips" role="group" aria-label="Ver productos">${[{ id: "todo", corto: "Todo" }, ...RUBROS].map((r) => `
      <button class="chip" data-act="rubro-inicio" data-v="${r.id}" aria-pressed="${filtro === r.id}">${r.corto}</button>`).join("")}</div>
    <div class="list">${RUBROS.filter((r) => filtro === "todo" || r.id === filtro).map((r) => { const ps = PRODUCTOS.filter((p) => p.rubro === r.id);

    <p class="note">Prototipo con datos de ejemplo. Los precios reales vendrán del mercado mayorista y de los aportes de la gente.</p>`;

function vProducto(pid) {
  const p = prod(pid);
  const filas = lugares().map((L) => ({ L, x: precioLugar(p, L), h: L.tipo === "super" ? null : precioHoy(p, L) })).sort((a, b) => a.x - b.x);
  const m = merc(state.mercadoActivo), h = precioHoy(p, m), antes = semanaPasada(p, m);
  const pts = [antes, r10((antes * 2 + h.precio) / 3), r10((antes + h.precio * 2) / 3), h.precio];
  const lo = Math.min(...pts) * 0.97, hi = Math.max(...pts) * 1.03;
  const y = (v) => 64 - ((v - lo) / (hi - lo || 1)) * 56;
  const linea = pts.map((v, i) => `${10 + i * 93},${y(v).toFixed(1)}`).join(" ");
  const e = estadoProd(p, m), motivo = motivoProd(e), subs = sustitutos(p, filas[0] ? filas[0].L : m).slice(0, 3);
  const fuente = (f) => f.L.tipo === "super" ? (precioReal(p, f.L) ? `Súper · online del ${fechaCorta(state.superReal.fecha)}` : "Súper · ejemplo")
    : `Mercado · ${f.h.observado ? `${f.h.n} lo vieron hoy` : "estimado de ejemplo"}`;
  return `<button class="back" data-go="inicio">‹ Volver a precios</button>
    <div style="display:flex;gap:14px;align-items:center"><span style="font-size:3rem" aria-hidden="true">${emoP(p)}</span><h1>${p.nombre}</h1></div>
    <div class="card"><h2>¿Dónde está más barato hoy?</h2>${filas.map((f, i) => `
      <div class="mrow"><span><b>${esc(nombreLugar(f.L))}</b><br><span class="small muted">${fuente(f)}${distTxt(f.L)}${i ? ` · ${soles(f.x - filas[0].x)} más` : ""}</span>
      ${i === 0 && filas.length > 1 ? `<br><span class="cheap">Más barato</span>` : ""}</span>
      <span class="tag"><span class="p">${soles(f.x)}</span><br><span class="u">${porUnidad(p)}</span></span></div>`).join("")}
    </div>
    ${subs.length ? `<div class="card"><h2>${motivo ? "¿Caro o no hay? Prueba con" : "Si no encuentras, prueba con"}</h2>
      ${motivo ? `<span class="pill up" style="justify-self:start">${esc(motivo)}</span>` : ""}
      ${subs.map((x) => `<div class="mrow"><span><b>${emoP(x.s)} ${esc(x.s.nombre)}</b>${x.nota ? `<br><span class="small muted">${esc(x.nota)}</span>` : ""}
        ${x.ahorro > 0.05 ? `<br><span class="pill down">${Math.round(x.ahorro * 100)}% más barato</span>` : ""}</span>
        <span class="tag"><span class="p">${soles(x.eq)}</span><br><span class="u">por ${unidadSola(p)}</span></span></div>`).join("")}
      <p class="small muted">Lo que cuesta reemplazar 1 ${unidadSola(p)} de ${esc(p.nombre.toLowerCase())}, en ${esc(nombreLugar(filas[0].L))}.</p></div>` : ""}
    <div class="card"><h2>En ${esc(m.nombre.replace("Mercado ", ""))}, esta semana</h2>
      <svg viewBox="0 0 300 76" role="img" aria-label="Pasó de ${soles(antes)} hace una semana a ${soles(h.precio)} hoy" style="width:100%;height:auto">
        <polyline points="${linea}" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="289" cy="${y(h.precio).toFixed(1)}" r="6" fill="var(--green)"/>
      </svg>
      <div style="display:flex;justify-content:space-between" class="small"><span>Hace 7 días<br><b>${soles(antes)}</b></span><span style="text-align:right">Hoy<br><b>${soles(h.precio)}</b></span></div>
    </div>
    <div class="card"><h2>¿Este precio está bien?</h2><p class="muted small">Si estás en el mercado, confírmalo y ganas ${PUNTOS.confirmar} puntos.</p>
      <div class="row2"><button class="btn sec" data-act="confirmar" data-v="${p.id}">Sí, está bien</button>
      <button class="btn sec" data-act="corregir" data-v="${p.id}">No, es otro</button></div></div>`;
}

function vAportar() {

  return `<h1>¿Qué quieres aportar?</h1>
    <div><p class="lbl">¿En qué mercado estás?</p>${chipsMercados()}</div>

}

function editorItem(it, i) {
  const p = it.producto ? prod(it.producto) : null;
  return `<div class="item"><div class="hd"><span>${p ? emoP(p) + " " + p.nombre : "Nuevo: " + esc(it.libre)}</span>
      <button class="x" data-act="quitar-item" data-v="${i}" aria-label="Quitar ${p ? p.nombre : esc(it.libre)}">✕</button></div>
    <div class="money"><button type="button" data-act="menos" data-v="${i}" aria-label="Diez céntimos menos">−</button>
      <input class="big" inputmode="decimal" data-precio="${i}" value="${Number(it.precio || 0).toFixed(2)}" aria-label="Precio en soles">
      <button type="button" data-act="mas" data-v="${i}" aria-label="Diez céntimos más">+</button></div>
    <select class="big" data-unidad="${i}" aria-label="Unidad">${UNIDADES.map((u) => `<option ${u === (it.unidad || (p && p.unidad) || "kilo") ? "selected" : ""}>${u}</option>`).join("")}</select></div>`;
}

function vManual() {
  const b = state.borrador || { items: [] };
  if (!b.items.length) return `<button class="back" ${b.volverFoto ? 'data-act="volver-foto"' : 'data-go="aportar"'}>‹ Atrás</button><h1>¿Qué producto?</h1>
    <div class="grid-prod">${PRODUCTOS.map((p) => `<button class="tile" data-act="elegir-manual" data-v="${p.id}"><span class="emo" aria-hidden="true">${emoP(p)}</span>${p.nombre}</button>`).join("")}</div>`;

    <div style="display:grid;gap:4px"><h1>¿A cuánto está?</h1>${ma ? `<p class="muted">En ${esc(ma.nombre)}</p>` : ""}</div>

}

function vNoHay() {

    <div class="grid-prod">${PRODUCTOS.map((p) => `<button class="tile" data-act="elegir-nohay" data-v="${p.id}"><span class="emo" aria-hidden="true">${emoP(p)}</span>${p.nombre}</button>`).join("")}</div>`;

    <div class="list"><button class="choice" data-act="enviar-nohay" data-v="no-hay" style="grid-template-columns:1fr"><span><b>No había</b><span>Ningún puesto lo tenía</span></span></button>
    <button class="choice" data-act="enviar-nohay" data-v="poco" style="grid-template-columns:1fr"><span><b>Había poco</b><span>Solo en uno o dos puestos</span></span></button></div>`;
}

function vGracias() {

  return `<div class="done"><div class="ok" aria-hidden="true">✓</div><h1>¡Gracias!</h1>
    <p class="pts">+${u.n} puntos</p>
    <p>${u.confirmado ? "Tu aporte ya se ve en el mercado." : "Tu aporte está en revisión. Los puntos se confirman cuando otra persona lo vea igual."}</p>
    ${u.n === 0 ? `<p class="note">Llegaste al tope de puntos de hoy. Tus aportes igual ayudan.</p>` : ""}</div>
    ${state.volverA === "semana" ? `<button class="btn" data-go="semana">Volver a mi lista</button>`
      : `<button class="btn" data-go="aportar">Aportar otro</button><button class="btn sec" data-go="inicio">Ver precios</button>`}`;
}

/* ---------------------------- mi semana: vistas ---------------------------- */
function vSemana() {
  if (state.perfil.rol === "resto") return vResto();
  if (!misMercados().length) return `<h1>Tu compra de la semana</h1><p class="muted">Primero elige tus mercados.</p>
    <button class="btn" data-act="editar-mercados">Elegir mercados</button>`;
  const paso = state.semPaso || (nPlatos() ? "lista" : "personas");
  return paso === "personas" ? semPersonas() : paso === "platos" ? semDias() : paso === "elegir" ? semElegir() : paso === "frutas" ? semFrutas() : paso === "historial" ? semHistorial() : semLista();
}

const numFs = (n) => (String(n).length >= 3 ? ' style="font-size:2.3rem"' : "");

function semPersonas() {
  const S = state.semana;
  return `${nPlatos() ? `<button class="back" data-act="sem-paso" data-v="lista">‹ Volver a mi lista</button>` : ""}

      <button type="button" data-act="sem-per" data-v="1" aria-label="Una persona más">+</button></div>

        <button type="button" data-act="sem-comidas" data-v="1" aria-pressed="${!!S.conCena}">Almuerzo y cena</button></div></div>
    <button class="btn" data-act="sem-paso" data-v="platos">Seguir</button>`;
}

/* Estado de la lectura de la foto del menú (casa o restaurante). */
function bloqueFotoMenu(boton) {
  const f = state.menuFoto;
  if (!f) return boton;
  if (f.estado === "leyendo") return `<div class="card" style="justify-items:center;text-align:center">${f.url ? `<img class="photo" src="${f.url}" alt="Tu foto del menú">` : ""}
    <div class="spin" role="progressbar" aria-label="Leyendo"></div><p class="status">Leyendo tu menú… tarda unos segundos.</p>
    <button class="btn quiet" data-act="menu-cancelar">Cancelar</button></div>`;
  if (f.estado === "lista") return `<div class="card" role="status"><h2>📷 Listo</h2><p>${esc(f.resumen)}</p>
    ${f.desconocidos.length ? `<p class="small muted">No tenemos receta de: ${esc(f.desconocidos.join(", "))}. Pronto podrás agregarlas.</p>` : ""}
    <div class="row2"><button class="btn sec" data-act="menu-deshacer">Deshacer</button><button class="btn" data-act="menu-ok">Está bien</button></div></div>`;
  return `<p class="note" role="alert">${esc(f.error || "No se pudo leer la foto.")}</p>${boton}`;
}
const botonFotoMenu = (txt, ayuda) => (state.puedeFoto ? `<label class="btn sec" for="in-menu">📷 ${txt}</label>
  <input id="in-menu" class="sr" type="file" accept="image/*" capture="environment">

/* Paso 2: la semana día por día. */
function semDias() {
  const S = state.semana, llenos = diasLlenos();
  return `<button class="back" data-act="sem-paso" data-v="personas">‹ ${S.personas} ${S.personas === 1 ? "persona" : "personas"}</button>
    <div style="display:grid;gap:6px"><h1>¿Qué cocinarás cada día?</h1>
      <p class="muted">Elige el ${S.conCena ? "almuerzo y la cena" : "almuerzo"} de cada día. Puedes dejar días vacíos.</p>
      ${(state.historial.items || []).length ? `<button class="link" data-act="sem-paso" data-v="historial" style="justify-self:start">📅 Mi historial</button>` : ""}</div>
    ${bloqueFotoMenu(botonFotoMenu("Foto de tu menú de la semana", "Si lo tienes escrito en un papel o pizarra, la app llena los días por ti."))}
    ${tarjetaMes()}
    ${state.aviso ? `<p class="note" role="status">${esc(state.aviso)}</p>` : ""}
    ${state.deshacer ? `<div class="note" role="status">${esc(state.deshacer.txt)} <button class="link" data-act="sem-deshacer" style="min-height:0">Deshacer</button></div>` : ""}
    <div class="dias">${DIAS.map((x) => {
      const todo = itemsTodo(x.id);
      const fila = (comida) => { const its = itemsDe(x.id, comida); return `<div class="dchips">${its.map((id) => { const d = plato(id); return `<span class="dchip"><span aria-hidden="true">${emoD(d)}</span> ${d.nombre}
          <button type="button" data-act="sem-quitar" data-v="${x.id}:${id}:${comida}" aria-label="Quitar ${d.nombre} del ${comida} del ${x.n}">✕</button></span>`; }).join("")}
          ${its.length < MAX_DIA ? `<button type="button" class="dadd" data-act="sem-elegir" data-v="${x.id}:${comida}">${its.length ? "+ Agregar plato, bebida o postre" : comida === "cena" ? "+ Elegir cena" : "+ Elegir plato"}</button>` : ""}</div>`; };
      return `<div class="dia${todo.length ? " on" : ""}"><div class="dhead"><b class="dn">${x.n}</b>
          ${todo.length ? `<span class="dacc"><button type="button" class="link" data-act="sem-repetir" data-v="${x.id}">⟳ Repetir</button>
            <button type="button" class="link" data-act="sem-limpiar-dia" data-v="${x.id}" aria-label="Limpiar el ${x.n}">🗑 Limpiar</button></span>` : ""}</div>
        ${S.conCena ? `<span class="dlab">Almuerzo</span>${fila("almuerzo")}<span class="dlab">Cena</span>${fila("cena")}` : fila("almuerzo")}
        ${state.repetir === x.id ? `<div class="dconf" role="group" aria-label="Repetir el ${x.n}"><b>¿A qué días copias el ${x.n}?</b>
          <div class="chips wrap"><button class="chip" data-act="sem-repetir-ok" data-v="${x.id}:vacios">Solo a los días vacíos</button>
            <button class="chip" data-act="sem-repetir-ok" data-v="${x.id}:todos">A toda la semana</button>
            <button class="chip" data-act="sem-repetir-no">Cancelar</button></div></div>` : ""}</div>`;
    }).join("")}</div>
    ${DIAS.some((x) => !itemsDia(x.id).length || (S.conCena && !itemsDe(x.id, "cena").length)) ? (state.llenar ? `<div class="card" style="gap:10px"><h2>💡 ¿Qué llenamos en los días vacíos?</h2>
        <p class="small muted">Con los platos más económicos de tus lugares, sin los que suben por El Niño.${S.conCena ? " La cena se llena con un plato de fondo." : ""}</p>
        <button class="btn" data-act="sem-economica" data-v="inteligente">🧠 Semana inteligente: barata, variada y balanceada</button>
        <button class="btn sec" data-act="sem-economica" data-v="segundo">Solo el segundo</button>
        <button class="btn sec" data-act="sem-economica" data-v="menu">Menú completo: entrada o sopa + segundo + bebida</button>
        <button class="btn quiet" data-act="sem-llenar-no">Cancelar</button></div>`
      : `<button class="btn sec" data-act="sem-llenar">💡 Llenar los días vacíos con platos económicos</button>`) : ""}
    ${nPlatos() ? (state.confLimpiar ? `<div class="card" style="gap:10px"><p><b>¿Borrar todos los platos de la semana?</b> Las frutas y tus marcas de "ya tengo" se quedan.</p>
        <div class="row2"><button class="btn quiet" data-act="sem-limpiar-semana-no">Cancelar</button><button class="btn" data-act="sem-limpiar-semana">Sí, limpiar</button></div></div>`
      : `<button class="btn quiet" data-act="sem-limpiar-semana-pre">🗑 Limpiar toda la semana</button>`) : ""}
    ${llenos ? `<div class="stick"><button class="btn" data-act="sem-paso" data-v="lista">Ver mi canasta · ${llenos} de 7 días</button></div>`
      : `<p class="note">Elige al menos un día para ver tu canasta.</p>`}`;
}

/* Elegir un plato para un día: una sola decisión por pantalla. */
function semElegir() {
  const id = state.semDia, comida = state.semComida || "almuerzo", x = dia(id), its = itemsDe(id, comida), tipo = state.semTipo || "segundo", ls = lugares();
  const S = state.semana, nP = S.personas;
  const tipos = [...TIPOS.filter((t) => t.id !== "fruta"), { id: "fit", nombre: "💪 Fit", por: "por plato" }, { id: "rapido", nombre: "⏱ Rápidos", por: "por plato" }];
  const fit = tipo === "fit", rapido = tipo === "rapido";
  const lista = (fit ? PLATOS.filter((d) => d.tipo !== "fruta" && esFit(d)).sort((a, b) => nutri(b).prot - nutri(a).prot)
    : rapido ? PLATOS.filter((d) => ["segundo", "sopa", "entrada"].includes(d.tipo) && (TIEMPO[d.id] || 99) <= 30).sort((a, b) => puntaje(b) - puntaje(a))
    : PLATOS.filter((d) => d.tipo === tipo).sort((a, b) => puntaje(b) - puntaje(a)));
  const pop = fit || rapido ? { ids: [], real: false } : populares(tipo);
  const lleno = its.length >= MAX_DIA;
  return `<button class="back" data-act="sem-paso" data-v="platos">‹ Volver a la semana</button>
    <div style="display:grid;gap:6px"><h1 style="text-transform:none">${x.n[0].toUpperCase() + x.n.slice(1)}${S.conCena ? (comida === "cena" ? ", cena" : ", almuerzo") : ""}: ¿qué vas a cocinar?</h1>
      <p class="muted">${lleno ? `Ya tienes ${MAX_DIA} cosas este día. Quita una para cambiarla.` : "Toca un plato y vuelves a tu semana. Puedes sumar hasta " + MAX_DIA + " por día."}</p></div>
    <div class="chips wrap" role="group" aria-label="Tipo de plato">${tipos.map((t) => `
      <button class="chip" data-act="sem-tipo" data-v="${t.id}" aria-pressed="${tipo === t.id}">${t.nombre}</button>`).join("")}</div>
    ${fit ? `<p class="small muted">Altos en proteína y moderados en calorías. Valores referenciales por porción; no reemplazan a un nutricionista.</p>` : ""}
    ${rapido ? `<p class="small muted">Listos en 30 minutos o menos, de principio a fin.</p>` : ""}
    <div class="opts">${lista.map((d) => {
      const c = ls.map((L) => costoPlatoCon(d, (p) => precioLugar(p, L))).sort((a, b) => a.t - b.t)[0], on = its.includes(d.id), n = nutri(d);
      const badge = pop.ids.includes(d.id) ? `<span class="pill pop">🔥 ${pop.real ? "Más elegido" : "Popular"}</span>` : "";
      const mm = marcaMes(d), marca = mm ? `<span class="pill ${mm.tipo === "sube" ? "up" : "down"}">${mm.tipo === "sube" ? "▲" : "▼"} ${esc(mm.txt)}</span>` : "";
      const fe = hierroDe(d) >= 4 && d.tipo !== "refresco" ? `<span class="pill fit">🩸 Hierro</span>` : "";
      const unidad = d.tipo === "refresco" ? "el vaso" : "por persona";
      return `<button class="opt" data-act="sem-poner" data-v="${id}:${d.id}" aria-pressed="${on}" ${lleno && !on ? "disabled" : ""}>
        <span class="emo" aria-hidden="true">${emoD(d)}</span><span class="name">${d.nombre}</span>
        <span class="meta"><span>≈ ${soles(c.t)} ${unidad}${nP > 1 ? ` · ${soles(c.t * nP)} para ${nP}` : ""}</span>${badge}${marca}${fe}${esFit(d) && !fit ? `<span class="pill fit">💪 Fit</span>` : ""}${c.riesgo >= 0.35 ? `<span class="pill up">Sube con El Niño</span>` : ""}
          ${n.kcal ? `<span class="kcal">${TIEMPO[d.id] ? `⏱ ${TIEMPO[d.id]} min · ` : ""}≈ ${n.kcal} kcal · ${n.prot} g proteína por porción</span>` : ""}</span>
        <span class="chk" aria-hidden="true">${on ? "✓" : ""}</span></button>`;
    }).join("")}</div>
    <p class="small muted">Precio de una porción en el lugar más barato hoy (ejemplo); al lado, lo que cuesta para las ${nP} ${nP === 1 ? "persona" : "personas"} de tu casa. Calorías y proteína: referenciales, según la receta casera.</p>`;
}

/* Frutas: sección aparte para no mezclar con los platos. */
function semFrutas() {
  const S = state.semana, ls = lugares();
  return `<button class="back" data-act="sem-paso" data-v="lista">‹ Volver a mi canasta</button>
    <div style="display:grid;gap:6px"><h1>Frutas de la semana</h1>
      <p class="muted">¿Cuántas por persona a la semana? Por ejemplo, 7 es una al día.</p></div>
    <div class="list">${PLATOS.filter((d) => d.tipo === "fruta").map((d) => {
      const v = S.frutas[d.id] || 0, c = ls.map((L) => costoPlatoCon(d, (p) => precioLugar(p, L)).t).sort((a, b) => a - b)[0];
      return `<div class="plato" data-on="${v > 0}"><span class="emo" aria-hidden="true">${emoD(d)}</span><b class="name">${d.nombre}</b>
        <div class="fila"><span class="meta"><span>≈ ${soles(c)} ${d.porcion[0] === "tajada" ? "cada tajada" : d.porcion[0] === "vaso" ? "cada vaso" : "cada " + d.porcion[0]}</span>${v ? `<span>${v} ${v === 1 ? d.porcion[0] : d.porcion[1]} por persona</span>` : ""}</span>
          <span class="step" role="group" aria-label="${d.nombre}: por persona a la semana">
            <button type="button" data-act="fruta-menos" data-v="${d.id}" aria-label="Una menos" ${v ? "" : "disabled"}>−</button>
            <output>${v}</output>
            <button type="button" data-act="fruta-mas" data-v="${d.id}" aria-label="Una más ${d.nombre}">+</button></span></div></div>`;
    }).join("")}</div>
    <button class="btn" data-act="sem-paso" data-v="lista">Listo, volver a mi canasta</button>`;
}

function filaLista(it, mL) {
  const S = state.semana, pr = precioLugar(it.p, mL), tengo = !!S.tengo[it.p.id], compre = !!S.compre[it.p.id];
  const visto = mL.tipo !== "super" && precioHoy(it.p, mL).observado;
  const planear = S.modo !== "comprar", off = planear ? tengo : compre;
  return `<div class="lrow${off ? " off" : ""}">
    <span class="emo" aria-hidden="true">${emoP(it.p)}</span>
    <span class="nm"><b>${it.p.nombre}</b><br><span class="small">${cantTxt(it.p, it.compra)}</span>${rindeTxt(it.p, it.compra) ? `<br><span class="small muted">${rindeTxt(it.p, it.compra)}</span>` : ""}<br>
      <span class="small muted">a ${soles(pr)} ${porUnidad(it.p)}${visto ? " · visto hoy" : ""}</span></span>
    <span class="pr">${planear && tengo ? "—" : soles(it.compra * pr)}</span>
    <span class="act">${planear
      ? `<button class="chip" data-act="sem-tengo" data-v="${it.p.id}" aria-pressed="${tengo}">${tengo ? "✓ Ya tengo" : "Ya tengo en casa"}</button>`
      : `<button class="chip" data-act="sem-compre" data-v="${it.p.id}" aria-pressed="${compre}">${compre ? "✓ Comprado" : "Lo compré"}</button>${compre && mL.tipo !== "super"
        ? `<button class="chip add" data-act="sem-reportar" data-v="${it.p.id}">¿A cuánto estaba? +${PUNTOS.manual}</button>` : ""}`}</span>
  </div>`;
}

/* Paso 3: la canasta. Primero el total y lo que te llevas en corto; el detalle, solo si lo pides. */
function semLista() {
  const S = state.semana, todos = compraSemana(), items = todos.filter((it) => !S.tengo[it.p.id]);
  const tot = totalesSemana(items), best = tot[0], worst = tot[tot.length - 1];
  const mL = mercLista(), planear = S.modo !== "comprar", llenos = diasLlenos();
  const combo = items.length && lugares().length > 1 ? mejorCombo(items) : null;
  const comboOk = combo && best.t - combo.t >= 5 && combo.asign[combo.a.id].length && combo.asign[combo.b.id].length;
  const riesgo = items.filter((it) => it.p.riesgo).map((it) => it.p.nombre.toLowerCase());
  const sug = sugerencias(best.m);
  const subsCanasta = items.map((it) => {
    const e = estadoProd(it.p, best.m); if (!(e.caro || e.escaso || e.riesgo)) return null;
    const x = sustitutos(it.p, best.m)[0]; if (!x || x.ahorro <= 0.08) return null;
    const ahorro = r2(it.compra * (precioLugar(it.p, best.m) - x.eq));
    return ahorro >= 1 ? { p: it.p, s: x.s, nota: x.nota, ahorro, motivo: motivoProd(e) } : null;
  }).filter(Boolean).sort((a1, b1) => b1.ahorro - a1.ahorro).slice(0, 4);
  const aparte = [...new Set(DIAS.flatMap((x) => itemsTodo(x.id)).flatMap((id) => (plato(id) && plato(id).aparte) || []))];
  const falta = items.filter((it) => !S.compre[it.p.id]);

function filaPedido(it) {
  const R = state.resto, ref = precioRef(it.p), mio = Number(R.precios[it.p.id]) || 0, pu = mio || ref;

    : dif < -0.05 ? `<span class="pill down">${Math.round(-dif * 100)}% bajo la referencia</span>` : `<span class="pill same">En precio</span>`;
  return `<div class="prow"><span class="emo" aria-hidden="true">${emoP(it.p)}</span>
    <span class="nm"><b>${it.p.nombre}</b><br><span class="small">${cantResto(it.p, it.compra)}</span></span>
    <span class="sub">${soles(it.compra * pu)}</span>
    <span class="inp"><label for="tp-${it.p.id}">Te cobra S/</label><input id="tp-${it.p.id}" inputmode="decimal" data-tprecio="${it.p.id}" value="${mio ? mio.toFixed(2) : ""}" placeholder="¿cuánto?"
      aria-describedby="rf-${it.p.id}"> <span>${POR_CORTO[it.p.unidad] || porUnidad(it.p)}</span>
      <span id="rf-${it.p.id}">· ref. ${soles(ref)}</span> ${pill}</span></div>`;
}

function restoCostos() {
  const R = state.resto, ds = diasConMenu();
  if (!ds.length) return `<div style="display:grid;gap:8px">${sello}<h1>Tu semana en números</h1></div>

  const pd = ds.map((d) => ({ d, ...costoDia(d) }));

  const fc = prom / R.precioMenu, sem = semaforo(fc);

  const caro = pd.reduce((a, x) => (x.t > a.t ? x : a));

  const conPrecio = items.filter((it) => Number(R.precios[it.p.id]) > 0);
  const dif = conPrecio.reduce((a, it) => a + (precioResto(it.p) - precioRef(it.p)) * it.compra, 0);
  const baseRef = conPrecio.reduce((a, it) => a + precioRef(it.p) * it.compra, 0);
  const caros = conPrecio.map((it) => ({ it, d: (precioResto(it.p) - precioRef(it.p)) / precioRef(it.p) })).filter((x) => x.d > 0.05).sort((a, b) => b.d - a.d).slice(0, 3);
  const nombres = (d) => { const x = diaMenu(d); return [...x.entrada, ...x.segundo].map((id) => plato(id).nombre).join(", "); };
  const aparte = [...new Set(Object.keys(porcionesSemana()).flatMap((id) => plato(id).aparte || []))];
  return `<div style="display:grid;gap:6px">${sello}<h1>Tu semana en números</h1>
      <p class="muted">${ds.length} ${ds.length === 1 ? "día" : "días"} · ${R.menusDia} menús al día · ${soles(R.precioMenu)} el menú</p>

      <div class="kpi"><span class="small muted">Te queda por menú</span><b>${soles(R.precioMenu - prom)}</b><span class="small muted">para gas, personal y alquiler</span></div>
      <div class="kpi"><span class="small muted">Compra de la semana</span><b>${soles(total)}</b><span class="small muted">${ds.length * R.menusDia} menús</span></div>
      <div class="kpi"><span class="small muted">Te queda en la semana</span><b>${soles(gan)}</b><span class="small muted">antes de otros gastos</span></div>
    </div>
    <p class="small muted">En un menú económico, si los insumos pasan de la mitad del precio queda muy poco para gas, personal y alquiler.</p>
    <div class="card"><h2>Día por día</h2>${pd.map((x) => `
      <div class="drow"><span><b style="text-transform:capitalize">${dia(x.d).n}</b><br><span class="small muted">${esc(nombres(x.d))}</span></span>
        <span>${soles(x.t)}</span><span class="semaf ${semaforo(x.t / R.precioMenu)}">${Math.round((x.t / R.precioMenu) * 100)}%</span></div>`).join("")}
      ${pd.length > 1 ? `<p>Tu día más caro es el <b>${dia(caro.d).n}</b>.</p>` : ""}</div>
    ${promR > 0 ? `<div class="alert" role="note"><span class="bang" aria-hidden="true">!</span><span><b>${Math.round((promR / prom) * 100)}% del costo de tu menú</b>

/* ---------------------------- foto de pizarra ---------------------------- */
let ctl = null;
async function leerFoto(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  state.borrador = { estado: "leyendo", url, fuente: state.borrador?.fuente || "foto", items: [] };
  render();
  ctl = new AbortController();
  const catalogo = PRODUCTOS.map((p) => p.nombre.toLowerCase()).join(", ");
  try {
    const res = await state.sample.json(
      "La imagen es una foto de la pizarra o cartel de precios de un puesto en un mercado de Lima, Perú. " +
      "Extrae cada producto con su precio en soles. Usa estos nombres cuando corresponda: " + catalogo + ". " +
      'Responde solo un arreglo JSON como [{"producto":"limón","precio":4.5,"unidad":"kilo"}]. ' +
      "La unidad es una de: " + UNIDADES.join(", ") + " (si no se ve, usa kilo). Si no se lee ningún precio, responde [].",
      { images: [file], modelTier: "quick", signal: ctl.signal });
    const items = (Array.isArray(res) ? res : []).map((r) => {
      const n = norm(r.producto), precio = Number(r.precio);
      const p = PRODUCTOS.find((x) => norm(x.nombre) === n) || (n.length >= 3 && PRODUCTOS.find((x) => n.includes(norm(x.nombre)) || norm(x.nombre).includes(n)))
        || (n.includes("limon") && prod("limon")) || (n.includes("cebolla") && prod("cebolla")) || (n.includes("aji") && prod("aji"))
        || (n.includes("papa") && (n.includes("amarill") ? prod("papa-amarilla") : prod("papa-blanca")))
        || ((n.includes("carne") || n.includes("bistec") || n.includes("lomo")) && prod("carne")) || ((n.includes("fideo") || n.includes("tallar")) && prod("fideos"))
        || (n.includes("lenteja") && prod("lenteja")) || (n.includes("aceite") && prod("aceite")) || (n.includes("leche") && prod("leche")) || (n.includes("arveja") && prod("arveja"));
      return precio > 0 && precio < 1000 ? { producto: p ? p.id : null, libre: p ? null : String(r.producto || "").slice(0, 40), precio: r10(precio), unidad: UNIDADES.includes(r.unidad) ? r.unidad : (p ? p.unidad : "kilo") } : null;
    }).filter(Boolean).slice(0, 20);
    state.borrador = { estado: "lista", url, fuente: state.borrador.fuente, items };
  } catch (err) {
    const msg = err && err.code === "cancelled" ? null
      : err && (err.code === "not_granted" || err.code === "sampling_disabled") ? "La lectura de fotos no está permitida. Puedes escribir los precios."
      : err && err.code === "image_rejected" ? "No se pudo usar esa foto. Prueba con otra."
      : err && err.code === "rate_limited" ? "Muchas fotos seguidas. Espera un momento e inténtalo de nuevo."
      : "No se pudo leer la foto. Inténtalo otra vez o escribe el precio.";
    state.borrador = { estado: null, fuente: state.borrador?.fuente, error: msg };
    if (err && (err.code === "not_granted" || err.code === "sampling_disabled")) state.puedeFoto = false;
  }
  render();
}

/* ---------------------------- imagen de la lista de compras ---------------------------- */
function dibujarLista(x, W) {
  const S = state.semana, items = porComprar(), L = mercLista(), P = 64, F = '"Atkinson Hyperlegible", Verdana, sans-serif';
  const wrap = (txt, font, max) => { x.font = font; const out = []; let line = "";
    for (const w of txt.split(" ")) { const t = line ? line + " " + w : w; if (x.measureText(t).width > max && line) { out.push(line); line = w; } else line = t; }
    if (line) out.push(line); return out; };
  const nombres = (ids) => ids.filter((id) => plato(id)).map((id) => plato(id).nombre).join(", ");
  const menu = DIAS.filter((d) => itemsTodo(d.id).length).map((d) => `${d.c}: ${nombres(itemsDia(d.id)) || "—"}${itemsCena(d.id).length ? " · Cena: " + nombres(itemsCena(d.id)) : ""}`);
  const lineas = menu.flatMap((t) => wrap(t, `30px ${F}`, W - 2 * P));
  const total = items.reduce((a, it) => a + it.compra * precioLugar(it.p, L), 0);
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, 100000);
  x.fillStyle = "#0b6b3a"; x.fillRect(0, 0, W, 200);

async function leerMenu(e, modo) {

  try {

      "La imagen es una foto de una pizarra, cartel o cuaderno con el menú " + (modo === "resto" ? "de un restaurante de menú" : "de comidas de una familia") + " en Perú. " +

      const d = platoDe(pl); if (d) nPl++; else if (pl && pl.nombre) desconocidos.add(String(pl.nombre).slice(0, 40)); return d; }).filter(Boolean) }))
      .filter((x) => x.platos.length);

function escalaLineas(fechas, series) {
  const W = 320, Hh = 170, pl = 44, pr = 50, pt = 10, pb = 22;

  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const x = (i) => pl + (fechas.length === 1 ? (W - pl - pr) / 2 : (i * (W - pl - pr)) / (fechas.length - 1));
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (Hh - pt - pb);
  return { W, Hh, pl, pr, pt, pb, lo, hi, x, y };
}
function graficoLineas(fechas, series) {
  const E = escalaLineas(fechas, series), { W, Hh, pl, pr, pb, lo, hi, x, y } = E;
  const ticks = [lo, (lo + hi) / 2, hi];
  const grid = ticks.map((t) => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="tk" x="${pl - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${t.toFixed(2)}</text>`).join("");
  const xl = `<text class="tk" x="${x(0)}" y="${Hh - 6}" text-anchor="start">${esc(fechaCorta(fechas[0]))}</text><text class="tk" x="${x(fechas.length - 1)}" y="${Hh - 6}" text-anchor="end">${esc(fechaCorta(fechas[fechas.length - 1]))}</text>`;
  const finales = series.map((s) => { let i = s.vals.length - 1; while (i >= 0 && !s.vals[i]) i--; return { s, i, v: s.vals[i] }; }).filter((f) => f.i >= 0);
  const ys = finales.map((f) => y(f.v)).sort((a, b) => a - b), separadas = ys.every((v, k) => !k || v - ys[k - 1] >= 12);
  const lineas = series.map((s) => {
    let d = "", pen = false;
    s.vals.forEach((v, i) => { if (v) { d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; } else pen = false; });
    return `<path class="ln s${s.slot}" d="${d}"/>`;
  }).join("");
  const puntos = finales.map((f) => `<circle class="dot f${f.s.slot}" r="4" cx="${x(f.i).toFixed(1)}" cy="${y(f.v).toFixed(1)}"/>${separadas ? `<text class="el" x="${(x(f.i) + 7).toFixed(1)}" y="${(y(f.v) + 3).toFixed(1)}">${f.v.toFixed(2)}</text>` : ""}`).join("");
  return `<svg class="viz" id="lc" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Precio por día en cada supermercado; usa la tabla para ver cada valor">
    ${grid}${xl}${lineas}${puntos}<line class="xh" id="lc-x" x1="0" x2="0" y1="${E.pt}" y2="${Hh - pb}" visibility="hidden"/>
    <rect id="lc-hit" x="${pl}" y="0" width="${W - pl - pr}" height="${Hh}" fill="transparent"/></svg>`;
}
function tablaLineas(fechas, series) {
  return `<table class="tv"><thead><tr><th>Día</th>${series.map((s) => `<th>${esc(s.n)}</th>`).join("")}</tr></thead><tbody>${fechas.map((f, i) => `<tr><td>${esc(fechaCorta(f))}</td>${series.map((s) => `<td>${s.vals[i] ? s.vals[i].toFixed(2) : "—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
/* Cruz que sigue al dedo: muestra el precio de cada cadena en el día más cercano. */
function conectarLineas(svg) {
  const D = state.lcData, tip = $("#lc-tip"), xh = $("#lc-x"), hit = $("#lc-hit");
  if (!D || !tip || !xh || !hit) return;
  const E = escalaLineas(D.fechas, D.series);
  const mostrar = (i) => {
    xh.setAttribute("x1", E.x(i)); xh.setAttribute("x2", E.x(i)); xh.setAttribute("visibility", "visible");
    tip.textContent = "";
    const dia = document.createElement("span"); dia.textContent = fechaCorta(D.fechas[i]) + ": "; tip.append(dia);
    D.series.forEach((s, k) => {
      const b = document.createElement("b"); b.textContent = s.vals[i] ? "S/ " + s.vals[i].toFixed(2) : "—";
      const n = document.createElement("span"); n.textContent = " " + s.n + (k < D.series.length - 1 ? " · " : "");

    let best = 0; D.fechas.forEach((_, i) => { if (Math.abs(E.x(i) - px) < Math.abs(E.x(best) - px)) best = i; });
    mostrar(best);

  hit.addEventListener("pointermove", mover); hit.addEventListener("pointerdown", mover);
  svg.setAttribute("tabindex", "0");
  let k = D.fechas.length - 1;

}

function reusosActivos() {

  ].map((m) => ({ ...m, falta: Math.max(0, m.n - cuenta(m.pids)) }));
  const cumple = (d, m) => m.pids.some((p) => (d.ing[p] || 0) >= 0.05);
  const segs = PLATOS.filter((d) => d.tipo === "segundo").map((d) => ({ d, c: costo(d) }));
  const S0 = state.semana, cerca = S0.compras === 2 ? ["lun", "mar", "jue", "vie"] : ["lun", "mar"];
  const perecible = (d) => Object.keys(d.ing).some((pid) => vida(pid) <= 2 && d.ing[pid] >= 0.05);
  const puntajeIA = (x, prev, dId) => {
    let s = x.c;
    if (perecible(x.d)) s *= cerca.includes(dId) ? 0.9 : 1.35;   // pescado y pollo cerca del día de compra
    if (Object.keys(sube).some((pid) => pesoEnPlato(x.d, pid) >= 0.15)) s *= 1.25;
    if (Object.keys(baja).some((pid) => pesoEnPlato(x.d, pid) >= 0.3)) s *= 0.92;
    if (costoPlatoCon(x.d, (p) => precioLugar(p, ls[0])).riesgo >= 0.35) s *= 1.15;
    if (prev.some((p) => REUSO.some((r) => r.de(p) && r.a.includes(x.d.id)))) s *= 0.8;
    return s;
  };
  const S = state.semana, puestos = [];
  /* Cada meta pendiente se asigna a un día: pescado y sangrecita/hígado lo más cerca posible de la compra; menestras, al final (duran). */
  const dist = (dId) => { const i = DIAS.findIndex((d) => d.id === dId); return S0.compras === 2 ? (i < 3 ? i : i - 3) : i; };
  const libres = [...diasAlm], tarea = {};
  const tomar = (m, cercanos) => {
    for (let n = 0; n < m.falta && libres.length; n++) {
      libres.sort((a, b) => (cercanos ? dist(a.id) - dist(b.id) : dist(b.id) - dist(a.id)) || DIAS.indexOf(a) - DIAS.indexOf(b));
      tarea[libres.shift().id] = m;
    }
  };
  tomar(metas[0], true); tomar(metas[2], true); tomar(metas[1], false);
  diasAlm.forEach((x, k) => {
    const i = DIAS.indexOf(x), prev = i > 0 ? itemsTodo(DIAS[i - 1].id) : [];
    let cand = segs.filter((y) => !usados.has(y.d.id));
    const m = tarea[x.id];
    if (m && m.falta > 0) { const c2 = cand.filter((y) => cumple(y.d, m)); if (c2.length) cand = c2; }
    else { const c3 = cand.filter((y) => !metas.some((mm) => mm.pids.includes("jurel") && cumple(y.d, mm)) || !perecible(y.d) || dist(x.id) <= 1); if (c3.length) cand = c3; }
    if (!cand.length) cand = segs;
    const elegido = cand.sort((a, b) => puntajeIA(a, prev, x.id) - puntajeIA(b, prev, x.id))[0].d;
    const verdura = VERDURAS.reduce((a, pid) => a + (elegido.ing[pid] || 0), 0);
    S.dias[x.id] = verdura >= 0.1 ? [elegido.id] : ["ensalada-criolla", elegido.id];   // verduras todos los días
    usados.add(elegido.id); puestos.push(elegido.id);
    for (const m of metas) if (cumple(elegido, m)) m.falta = Math.max(0, m.falta - 1);
  });
  const ligeras = ["dieta-pollo", "sopa-verduras", "tortilla-ensalada", "sopa-quinua", "aguadito", "menestron", "huevos-rusa"].map(plato).filter(Boolean)
    .map((d) => ({ d, c: costo(d) })).sort((a, b) => a.c - b.c);
  diasCena.forEach((x, k) => { S.cenas[x.id] = [ligeras[k % ligeras.length].d.id]; });
  return puestos;
}

/* ---------- frescura: en qué orden cocinar y cuándo comprar ---------- */
const PRIMERA = ["lun", "mar", "mie"];   // compra del lunes cubre lunes a miércoles; la del jueves, de jueves a domingo
function necesidadDia(dId) {
  const S = state.semana, tot = {};
  const add = (d, gente) => { for (const [pid, q] of Object.entries(d.ing)) tot[pid] = (tot[pid] || 0) + q * gente; };
  for (const id of itemsDia(dId)) { const d = plato(id); if (d) add(d, S.personas + (d.tipo === "segundo" ? S.taper || 0 : 0)); }
  for (const id of itemsCena(dId)) { const d = plato(id); if (d) add(d, S.personas); }
  return tot;
}
function dosCompras() {
  const S = state.semana, c1 = {}, c2 = {};
  for (const x of DIAS) for (const [pid, q] of Object.entries(necesidadDia(x.id))) {
    if (vida(pid) > 4) continue;
    const t = PRIMERA.includes(x.id) ? c1 : c2; t[pid] = (t[pid] || 0) + q;
  }
  const lista = (t) => PRODUCTOS.filter((p) => t[p.id] && !S.tengo[p.id]).map((p) => ({ p, compra: redondeo(p, t[p.id]) }));
  return { lunes: lista(c1), jueves: lista(c2) };
}
function avisosFrescura() {
  const out = [];
  DIAS.forEach((x, i) => {
    if (i < 2) return;
    for (const id of itemsTodo(x.id)) {
      const d = plato(id), corto = Object.keys(d.ing).filter((pid) => vida(pid) <= 2 && d.ing[pid] >= 0.05);
      if (corto.length && (state.semana.compras !== 2 || i >= 5)) out.push({ d, x, p: prod(corto[0]) });
    }
  });
  return out.slice(0, 3);
}
function tarjetaFrescura() {
  const S = state.semana, dos = S.compras === 2, av = avisosFrescura();
  const dc = dos ? dosCompras() : null;
  const fila = (its) => its.length ? its.map((it) => `${emoP(it.p)} ${esc(it.p.nombre)} <span class="muted">${esc(cantCorta(it.p, it.compra))}</span>`).join(" · ") : `<span class="muted">Nada fresco</span>`;
  return `<div class="card" style="gap:10px"><h2>🧊 ¿Cuántas veces vas al mercado?</h2>
    <div class="seg" role="group" aria-label="Veces que compras">
      <button type="button" data-act="sem-compras" data-v="1" aria-pressed="${!dos}">Una vez</button>
      <button type="button" data-act="sem-compras" data-v="2" aria-pressed="${dos}">Dos: lunes y jueves</button></div>
    ${dos ? `<p><b>Lunes:</b> todo lo de la lista, pero de lo fresco solo lo de lunes a miércoles: ${fila(dc.lunes)}</p>
      <p><b>Jueves:</b> ${fila(dc.jueves)}</p>` : `<p class="small muted">Pollo, pescado y carne duran 1 a 3 días en la refri. Si compras una sola vez, cocínalos al inicio de la semana.</p>`}
    ${av.map((a) => `<p class="note">⚠️ El ${esc(a.d.nombre.toLowerCase())} del ${esc(a.x.n)} lleva ${esc(a.p.nombre.toLowerCase())}: ${dos ? "cómpralo el mismo día o cámbialo al jueves o viernes" : "cómpralo ese día, pásalo a inicio de semana o elige dos compras"}.</p>`).join("")}
    <p class="small muted">Con el calor de El Niño la comida se malogra más rápido: guarda pollo y pescado en la parte más fría de la refri y no dejes comida cocida fuera más de 2 horas.</p></div>`;
}

/* ---------- aderezo de la semana y tiempos ---------- */
function tarjetaAderezo() {
  const S = state.semana, gente = S.personas;
  const conAd = DIAS.flatMap((x) => itemsTodo(x.id)).map(plato).filter((d) => d && ["segundo", "sopa"].includes(d.tipo) && d.ing.cebolla && d.ing.ajo);
  if (conAd.length < 3) return "";
  const g = (pid) => Math.round(conAd.reduce((a, d) => a + (d.ing[pid] || 0), 0) * gente * 1000);
  return `<div class="card" style="gap:6px"><h2>👩‍🍳 Truco de chef: aderezo de la semana</h2>
    <p>${conAd.length} de tus platos parten del mismo aderezo. El domingo sofríe de una vez <b>${g("cebolla")} g de cebolla, ${g("ajo")} g de ajo${g("aji") ? ` y ${g("aji")} g de ají amarillo` : ""}</b>, guárdalo en un frasco en la refri y úsalo hasta el jueves.</p>
    <p class="small muted">Te ahorras unos ${conAd.length * 10} minutos de picar y freír en la semana.</p></div>`;
}

/* ---------- balance de la semana (Guías alimentarias para la población peruana, MINSA 2019) ---------- */
function tarjetaBalance() {
  const S = state.semana, dias = DIAS.filter((x) => itemsTodo(x.id).length);
  if (!dias.length) return "";
  const platos = dias.flatMap((x) => itemsTodo(x.id)).map(plato).filter(Boolean);
  const tiene = (d, pids, min = 0.05) => pids.some((p) => (d.ing[p] || 0) >= min);
  const diasVerdura = dias.filter((x) => itemsTodo(x.id).map(plato).reduce((a, d) => a + VERDURAS.reduce((b, p) => b + (d.ing[p] || 0), 0), 0) >= 0.1).length;
  const diasAnimal = dias.filter((x) => itemsTodo(x.id).map(plato).some((d) => tiene(d, ANIMAL, 0.03))).length;
  const menestras = platos.filter((d) => tiene(d, ["lenteja", "frejol"], 0.03)).length;
  const pescado = platos.filter((d) => tiene(d, ["jurel"])).length;
  const hierro = platos.filter((d) => hierroDe(d) >= 4).length;
  const azucar = Math.round(platos.reduce((a, d) => a + (d.ing.azucar || 0), 0) * 1000 / Math.max(1, dias.length));
  const fila = (ok, txt, ayuda) => `<div class="bal"><span class="ic" aria-hidden="true">${ok ? "✅" : "➕"}</span><span>${txt}${!ok && ayuda ? `<br><span class="small muted">${ayuda}</span>` : ""}</span></div>`;
  return `<div class="card" style="gap:6px"><h2>🥗 Balance de tu semana</h2>
    ${fila(diasVerdura >= dias.length, `Verduras ${diasVerdura} de ${dias.length} días`, "Las guías del MINSA piden verduras todos los días.")}
    ${diasVerdura < dias.length ? `<button class="chip" data-act="sem-ensalada" style="justify-self:start;white-space:normal;text-align:left;max-width:100%">🥗 Agregar ensalada criolla a los ${dias.length - diasVerdura} días sin verduras</button>` : ""}
    ${fila(diasAnimal >= dias.length, `Un alimento de origen animal ${diasAnimal} de ${dias.length} días`, "Huevo, pescado, pollo, carne o vísceras: uno al día.")}
    ${fila(menestras >= 2, `Menestras: ${menestras} ${menestras === 1 ? "vez" : "veces"}`, "Te sugerimos al menos 2: lentejas, seco con frejoles o tacu tacu.")}
    ${fila(pescado >= 2, `Pescado: ${pescado} ${pescado === 1 ? "vez" : "veces"}`, "Te sugerimos 2: el jurel es barato y nutritivo; prueba sudado o pescado a la plancha.")}
    ${fila(hierro >= 2, `Platos ricos en hierro: ${hierro}`, "Contra la anemia: sangrecita, hígado o menestras. Acompáñalos con limón o naranja para absorber mejor el hierro.")}
    ${azucar >= 25 ? `<p class="small">🍬 Tus bebidas y postres suman ≈ ${azucar} g de azúcar por persona al día. Las guías piden reducirla: prueba con menos azúcar o refrescos de fruta sin endulzar.</p>` : ""}
    <p class="small muted">Referencial, según las Guías alimentarias para la población peruana. No reemplaza a un nutricionista.</p></div>`;
}

/* ---------- despensa: lo que no se cotiza pero hay que tener ---------- */
function tarjetaDespensa(items, k) {
  const marcados = (k === "resto" ? state.resto.despensa : state.semana.despensa) || {};
  if (!items.length) return "";
  const faltan = items.filter((x) => !marcados[x]).length;
  return `<div class="card" style="gap:8px"><h2>🧂 Revisa tu despensa</h2>
    <p class="small muted">Esto no lo sumamos al precio. Marca lo que ya tienes${faltan ? `: te faltan ${faltan}` : ": ¡tienes todo!"}.</p>
    <div class="chips wrap" role="group" aria-label="Despensa">${items.map((x) => `<button class="chip" data-act="despensa" data-v="${k}:${esc(x)}" aria-pressed="${!!marcados[x]}">${marcados[x] ? "✓ " : ""}${esc(x)}</button>`).join("")}</div></div>`;
}

/* ---------- restaurante: fichas técnicas e ingeniería de menú ---------- */
const gramos = (p, q) => (p.unidad === "kilo" ? `${Math.round(q * 1000)} g` : p.unidad === "litro" ? `${Math.round(q * 1000)} ml` : `${Math.round(q * 100) / 100} ${p.unidad === "lata" ? "lata" : (p.cuenta || ["unidad"])[0]}`);
function tarjetaFichas() {
  const ids = Object.keys(porcionesSemana()); if (!ids.length) return "";
  return `<div class="card" style="gap:8px"><h2>📋 Fichas técnicas</h2>
    <p class="small muted">Por porción, con tus precios o la referencia mayorista y 5% de merma. Precio sugerido a la carta con 30% y 35% de costo de insumos.</p>
    ${ids.map(plato).sort((a, b) => TIPOS.findIndex((t) => t.id === a.tipo) - TIPOS.findIndex((t) => t.id === b.tipo)).map((d) => {
      const c = costoPlatoCon(d, precioResto).t * (1 + MERMA), n = nutri(d);
      return `<details class="ficha"><summary><span>${emoD(d)} ${esc(d.nombre)}</span><b>${soles(c)}</b></summary>
        <table class="tv"><thead><tr><th>Insumo</th><th>Por porción</th><th>Costo</th></tr></thead><tbody>${Object.entries(d.ing).map(([pid, q]) => {
          const p = prod(pid), r = REND[pid]; return `<tr><td>${esc(p.nombre)}${r && r[0] < 0.9 ? `<br><span class="small muted">aprovechas ${Math.round(r[0] * 100)}%</span>` : ""}</td><td>${gramos(p, q)}</td><td>${soles(q * precioResto(p))}</td></tr>`; }).join("")}</tbody></table>
        <p class="small">${TIEMPO[d.id] ? `⏱ ${TIEMPO[d.id]} min · ` : ""}≈ ${n.kcal} kcal · ${n.prot} g proteína${d.aparte && d.aparte.length ? ` · Aparte: ${esc(d.aparte.join(", "))}` : ""}</p>
        ${["segundo", "entrada", "sopa"].includes(d.tipo) ? `<p class="small">Precio sugerido a la carta: <b>${soles(Math.ceil(c / 0.3 * 2) / 2)}</b> con 30% · ${soles(Math.ceil(c / 0.35 * 2) / 2)} con 35%</p>` : ""}</details>`;
    }).join("")}</div>`;
}
function tarjetaIngenieria() {
  const R = state.resto, por = porcionesSemana();
  const segs = Object.keys(por).map(plato).filter((d) => d.tipo === "segundo");
  if (segs.length < 2) return `<div class="card"><h2>🧭 Ingeniería de menú</h2><p class="muted">Marca al menos 2 segundos distintos en la semana para comparar cuáles te convienen.</p></div>`;
  const resto = (ds) => ds.reduce((a, d) => { const x = diaMenu(d); const prom = (ids) => (ids.length ? ids.reduce((s, i) => s + costoPlatoCon(plato(i), precioResto).t, 0) / ids.length : 0);
    return a + prom(x.entrada) + (x.refresco ? costoPlatoCon(plato(x.refresco), precioResto).t : 0) + (x.postre ? costoPlatoCon(plato(x.postre), precioResto).t : 0); }, 0) / Math.max(1, ds.length);
  const acomp = resto(diasConMenu());
  const ventas = R.ventas || {}, conVentas = segs.some((d) => Number(ventas[d.id]) > 0);
  const filas = segs.map((d) => {
    const costo = (costoPlatoCon(d, precioResto).t + acomp) * (1 + MERMA), margen = R.precioMenu - costo;
    const pop = conVentas ? Number(ventas[d.id]) || 0 : puntaje(d);
    return { d, costo, margen, pop };
  });
  const mMar = filas.reduce((a, f) => a + f.margen, 0) / filas.length, mPop = filas.reduce((a, f) => a + f.pop, 0) / filas.length;
  const grupo = (f) => (f.pop >= mPop ? (f.margen >= mMar ? "estrella" : "caballo") : f.margen >= mMar ? "puzzle" : "perro");
  const G = {
    estrella: ["⭐ Estrellas", "Se venden y dejan buen margen. Mantenlos y cuida que la porción no crezca."],
    caballo: ["🐴 Caballos de batalla", "Se venden mucho pero dejan poco. Revisa el gramaje o cambia un insumo caro."],
    puzzle: ["🧩 Por impulsar", "Dejan buen margen pero salen poco. Ponlos primeros en la pizarra o recomiéndalos."],
    perro: ["🐶 Para revisar", "Salen poco y dejan poco. Cámbialos por otro plato."],
  };
  return `<div class="card" style="gap:10px"><h2>🧭 Ingeniería de menú</h2>
    <p class="small muted">Cruza lo que se vende con lo que te deja cada segundo (precio del menú menos insumos, con la entrada, el refresco y el postre promedio).
      ${conVentas ? "Popularidad: tus ventas de la semana." : "Popularidad: lo que eligen las familias en Acuánto. Escribe tus ventas para usar las tuyas."}</p>
    ${Object.keys(G).map((k) => { const xs = filas.filter((f) => grupo(f) === k); return xs.length ? `<div class="ing ${k}"><b>${G[k][0]}</b><span class="small muted">${G[k][1]}</span>
      ${xs.map((f) => `<div class="ingrow"><span>${emoD(f.d)} ${esc(f.d.nombre)}</span><span class="small">te deja ${soles(f.margen)}</span></div>`).join("")}</div>` : ""; }).join("")}
    <details><summary>Escribir mis ventas de la semana</summary>
      ${filas.map((f) => `<div class="ingrow"><label for="vt-${f.d.id}">${esc(f.d.nombre)}</label><input class="mini" id="vt-${f.d.id}" inputmode="numeric" data-venta="${f.d.id}" value="${Number(ventas[f.d.id]) || ""}" placeholder="0"></div>`).join("")}
      <button class="btn sec" data-act="resto-ventas">Usar mis ventas</button></details></div>`;
}

async function cargarPreciosSuper() {
  if (window.claude || !/^https?:$/.test(location.protocol)) return;  // dentro de Claude no hay archivo de precios
  try {
    const ctl2 = new AbortController(), t = setTimeout(() => ctl2.abort(), 4000);
    const r = await fetch("precios_super.json", { cache: "no-cache", signal: ctl2.signal }); clearTimeout(t);
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.fecha && d.cadenas && typeof d.cadenas === "object") state.superReal = d;
  } catch (e) {}
}
/* En GitHub Pages hay un lugares.json que se actualiza cada lunes; si es más nuevo que el incluido en la app, se usa ese. */
async function cargarLugaresWeb() {
  if (window.claude || !/^https?:$/.test(location.protocol)) return;
  try {
    const ctl3 = new AbortController(), t = setTimeout(() => ctl3.abort(), 6000);
    const r = await fetch("lugares.json", { cache: "no-cache", signal: ctl3.signal }); clearTimeout(t);
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.fecha && (!LUG.fecha || d.fecha > LUG.fecha) && cargarLugares(d) && state.view !== "bienvenida") render();
  } catch (e) {}
}
(async function inicio() {
  state.perfil = perfilVacio(); state.semana = semanaVacia(); state.resto = restoVacio();
  try { cargarLugares(JSON.parse(document.getElementById("lugares-osm").textContent)); } catch (e) {}
  render();
  const cl = window.claude;
  const [db, user, sample, downloads] = cl ? await Promise.all([cl.use("db"), cl.use("user"), cl.use("sample"), cl.use("downloads")]) : [null, null, null, null];
  state.db = db; state.sample = sample; state.downloads = downloads;
  state.uid = user ? await user.id() : null;
  if (sample) { try { const lim = await sample.limits(); state.puedeFoto = !!lim.images; } catch (e) { state.puedeFoto = false; } }
  await cargar();
  rehacerMapa();
  state.perfil.mercados = (state.perfil.mercados || []).filter((id) => merc(id));   // quita mercados que ya no existen
  const u = LS.get("acuanto.ubic");
  if (u && Number.isFinite(u.la) && Number.isFinite(u.lo) && dentroDeLima(u.la, u.lo) && Date.now() - (u.ts || 0) < 90 * 864e5) state.ubic = u;
  await Promise.all([cargarPreciosSuper(), cargarLugaresWeb(), cargarHist(), cargarPopulares()]);
  evento("abrir", { distrito: state.perfil.distrito || null, mercados: (state.perfil.mercados || []).length, nuevo: !state.perfil.acepto,
    precios_super: !!state.superReal, ubicacion: !!state.ubic, lugares: LUG.fecha, instalada: matchMedia("(display-mode: standalone)").matches });
  if (state.perfil.acepto && state.perfil.mercados.length) {
    state.mercadoActivo = state.perfil.rol === "puesto" && state.perfil.puesto ? state.perfil.puesto.mercado : state.perfil.mercados[0];
    state.view = state.perfil.rol === "puesto" ? "puesto" : state.perfil.rol === "resto" ? "semana" : "inicio";
  }
  render();
  if (db) {
    db.collection("reportes").where("dia", "==", hoy()).onSnapshot((snap) => {
      state.reportes = snap.docs.map((d) => d.data());
      if (["inicio", "producto"].includes(state.view)) render();
    }, () => {});
  }
})();

<script>
/* Versión web: funciona sin conexión y se puede "Agregar a la pantalla de inicio". */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  /* Buscar versión nueva al abrir y al volver a la app; si llega, ofrecer actualizar con un toque. */
  const habia = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!habia || document.getElementById("nueva-version")) return;
    const d = document.createElement("div");
    d.id = "nueva-version"; d.setAttribute("role", "status");
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:#0b6b3a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font:700 1rem/1.3 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)";
    const t = document.createElement("span"); t.textContent = "Hay una versión nueva de Acuánto";
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Actualizar";
    btn.style.cssText = "min-height:44px;border:0;border-radius:10px;padding:0 14px;background:#ffd60a;color:#1d1a00;font:700 1rem system-ui,sans-serif";
    btn.addEventListener("click", () => location.reload());
    d.append(t, btn); document.body.append(d);
  });
