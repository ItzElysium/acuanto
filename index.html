    }
    state.menuFoto = nPl ? { estado: "lista", resumen: `Leímos ${nPl} ${nPl === 1 ? "plato" : "platos"}${nDias > 1 ? ` de ${nDias} días` : ""} y ya los pusimos en tu ${modo === "resto" ? "menú" : "semana"}. Revisa y corrige lo que haga falta.`, desconocidos: [...desconocidos].slice(0, 8) }
      : { estado: "error", error: desconocidos.size ? `Leímos ${[...desconocidos].slice(0, 5).join(", ")}, pero aún no tenemos esas recetas.` : "No pudimos leer platos en la foto. Prueba con más luz y más cerca." };
  } catch (err) {
    state.menuFoto = err && err.code === "cancelled" ? null : { estado: "error", error:
      err && (err.code === "not_granted" || err.code === "sampling_disabled") ? "La lectura de fotos no está permitida en esta vista. Puedes elegir los platos a mano."
      : err && err.code === "image_rejected" ? "No se pudo usar esa foto. Prueba con otra."
      : err && err.code === "rate_limited" ? "Muchas fotos seguidas. Espera un momento e inténtalo de nuevo."
      : "No se pudo leer la foto. Inténtalo otra vez o elige los platos a mano." };
    if (err && (err.code === "not_granted" || err.code === "sampling_disabled")) state.puedeFoto = false;
  }
  render();
}

      const R = state.resto, d = plato(v);
      for (const x of Object.values(R.menu)) { const i = x.segundo.indexOf(d.id); if (i >= 0) { if (x.segundo.includes(d.cambio)) x.segundo.splice(i, 1); else x.segundo[i] = d.cambio; } }
      state.toast = `Listo: cambiamos ${d.nombre.toLowerCase()} por ${plato(d.cambio).nombre.toLowerCase()} en todo el menú.`; guardarResto(); break;
    }
    case "resto-copiar": {
      leerTPrecios(); const pv = PROVEEDORES.find((x) => x.id === v), its = compraResto().filter((it) => pv.rubros.includes(it.p.rubro));
      await copiar(v, textoPedido(pv, its)); break;
    }
    case "resto-recalcular": leerTPrecios(); guardarResto(); state.toast = "Listo, recalculamos con tus precios."; break;
    case "resto-aportar": {
      leerTPrecios(); const R = state.resto, its = compraResto().filter((it) => Number(R.precios[it.p.id]) > 0);
      if (!its.length || R.aportadoDia === hoy()) break;
      const docs = its.map((it) => ({ dia: hoy(), ts: Date.now(), mercado: "proveedor-lima", producto: it.p.id, libre: null, precio: Number(R.precios[it.p.id]), unidad: it.p.unidad, fuente: "proveedor", autor: null }));
      if (state.db) { for (const d of docs) { try { await state.db.collection("reportes").add(d); } catch (e) {} } }
      R.aportadoDia = hoy(); guardarResto();
      const n = sumarPuntos(10, `Precios de proveedor (${its.length})`, false);
      state.toast = `Gracias. Aportaste ${its.length} precios (+${n} puntos en revisión).`; break;
    }

    /* Opiniones */
    case "ir-ideas": abrirIdeas(); return;
    case "ideas-volver": {
      const I = state.idea; if (I.enviado) state.idea = { nota: null, util: [], frecuencia: null, pago: null, texto: "", enviado: null };
      state.view = state.desde && state.desde !== "ideas" ? state.desde : "inicio"; state.copia = null; render(); window.scrollTo(0, 0); enfocarTitulo(); return;
    }
    case "idea-nota": state.idea.nota = v; break;
    case "idea-frec": state.idea.frecuencia = v; break;
    case "idea-pago": state.idea.pago = v; break;
    case "idea-util": { const u = state.idea.util; state.idea.util = u.includes(v) ? u.filter((x) => x !== v) : [...u, v]; break; }
    case "idea-copiar": await copiar("idea", textoIdea()); break;
    case "idea-enviar": {
      const I = state.idea, t = $("#idea-txt"); if (t) I.texto = t.value;
      if (!I.nota && !I.texto.trim() && !I.util.length) { alertaInline("Marca una carita o escribe tu idea antes de enviar."); return; }
      if (state.db) {
        try {
          await state.db.collection("ideas").add({ ts: Date.now(), version: VERSION, rol: state.perfil.rol || null, nota: I.nota, util: I.util,
            frecuencia: I.frecuencia, pago: I.pago, texto: I.texto.trim().slice(0, 1000) });
          I.enviado = "db"; if (state.perfil.acepto) sumarPuntos(10, "Tu opinión", true);
        } catch (e) { I.enviado = "share"; }
      } else I.enviado = "share";
      render(); window.scrollTo(0, 0); enfocarTitulo(); return;
    }
    case "editar-puesto": state.borrador = { registro: { mercado: P.puesto.mercado, numero: P.puesto.numero, rubros: [...P.puesto.rubros] } }; break;
    case "sin-stock": leerPrecios(); state.borrador.sinStock[v] = !state.borrador.sinStock[v]; break;
    case "pmenos": case "pmas": leerPrecios(); state.borrador.precios[v] = Math.max(0.1, r10(state.borrador.precios[v] + (act === "pmas" ? 0.1 : -0.1))); break;
    case "publicar-puesto": {
      leerPrecios();
      const pu = P.puesto, b = state.borrador;
      const items = Object.entries(b.precios).filter(([id]) => !b.sinStock[id]).map(([id, precio]) => ({ producto: id, precio, unidad: prod(id).unidad }));
      const faltan = Object.keys(b.sinStock).filter((id) => b.sinStock[id]);
      state.mercadoActivo = pu.mercado;
      await enviarReportes(items, "puesto");
      if (faltan.length) await enviarReportes(faltan.map((id) => ({ producto: id, precio: null, unidad: "no-hay" })), "nohay");
      pu.precios = Object.fromEntries(items.map((i) => [i.producto, i.precio]));
      pu.publicado = new Date().toLocaleString("es-PE", { weekday: "long", hour: "numeric", minute: "2-digit" });
      if (state.db && state.uid) { try { await state.db.doc("puestos/" + state.uid).set({ mercado: pu.mercado, numero: pu.numero, rubros: pu.rubros, precios: pu.precios, dia: hoy(), ts: Date.now() }); } catch (e) {} }
      const n = sumarPuntos(PUNTOS.puesto, `Publicaste tus precios (puesto ${pu.numero})`, true);
      state.ultimo = { n, confirmado: true }; return ir("gracias");
    }
  }
  render();
}
function alertaInline(t) { const p = document.createElement("p"); p.className = "note"; p.setAttribute("role", "alert"); p.textContent = t; $("#main").append(p); p.scrollIntoView({ block: "center" }); }

document.addEventListener("click", async (e) => {
  const go = e.target.closest("[data-go]"); if (go) { ir(go.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const { act, v } = a.dataset, teclado = e.detail === 0, y = window.scrollY;
  await accion(act, v);
  /* Con teclado, el foco vuelve al mismo botón después de redibujar (pasos − / +, marcas de la lista). */
  if (teclado && state.view === "semana") {
    const sel = `[data-act="${act}"]` + (v != null ? `[data-v="${CSS.escape(v)}"]` : "");
    const b = document.querySelector(sel); if (b && !b.disabled) { b.focus({ preventScroll: true }); window.scrollTo(0, y); }
  }
});
function abrirIdeas() {
  if (state.view !== "ideas") state.desde = state.view;
  state.view = "ideas"; state.copia = null; render(); window.scrollTo(0, 0); enfocarTitulo();
}
$("#btn-opinar").addEventListener("click", abrirIdeas);
document.addEventListener("input", (e) => { if (e.target.id === "idea-txt") state.idea.texto = e.target.value; });
/* Precios que escribe el restaurante: se guardan al salir del campo, sin redibujar (no se cierra el teclado). */
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.tprecio) { leerTPrecios(); guardarResto(); }
  if (t.id === "rp-precio") { leerPrecioMenu(); guardarResto(); }
});
$("#btn-letra").addEventListener("click", () => {
  const i = LETRAS.findIndex((l) => l.id === state.perfil.letra);
  state.perfil.letra = LETRAS[(i + 1) % LETRAS.length].id; guardar(); render();
});

/* ---------------------------- arranque ---------------------------- */
async function cargarPreciosSuper() {
  if (window.claude || !/^https?:$/.test(location.protocol)) return;  // dentro de Claude no hay archivo de precios
  try {
    const ctl2 = new AbortController(), t = setTimeout(() => ctl2.abort(), 4000);
    const r = await fetch("precios_super.json", { cache: "no-cache", signal: ctl2.signal }); clearTimeout(t);
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.fecha && d.cadenas && typeof d.cadenas === "object") state.superReal = d;
  } catch (e) {}
}
(async function inicio() {
  state.perfil = perfilVacio(); state.semana = semanaVacia(); state.resto = restoVacio();
  render();
  const cl = window.claude;
  const [db, user, sample] = cl ? await Promise.all([cl.use("db"), cl.use("user"), cl.use("sample")]) : [null, null, null];
  state.db = db; state.sample = sample;
  state.uid = user ? await user.id() : null;
  if (sample) { try { const lim = await sample.limits(); state.puedeFoto = !!lim.images; } catch (e) { state.puedeFoto = false; } }
  await cargar();
  await cargarPreciosSuper();
  if (state.perfil.acepto && state.perfil.mercados.length) {
    state.mercadoActivo = state.perfil.rol === "puesto" && state.perfil.puesto ? state.perfil.puesto.mercado : state.perfil.mercados[0];
    state.view = state.perfil.rol === "puesto" ? "puesto" : state.perfil.rol === "resto" ? "semana" : "inicio";
  }
  render();
  if (db) {
    db.collection("reportes").where("dia", "==", hoy()).onSnapshot((snap) => {
      state.reportes = snap.docs.map((d) => d.data());
      if (["inicio", "producto"].includes(state.view)) render();
    }, () => {});
  }
})();
</script>

<script>
/* Versión web: funciona sin conexión y se puede "Agregar a la pantalla de inicio". */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
