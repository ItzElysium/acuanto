# Publica Acuánto en GitHub Pages; cada mañana actualiza los precios online de supermercados y cada lunes los mercados cercanos (OpenStreetMap).
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar Acuánto

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"     # 6:30 a. m. de Lima (11:30 UTC)
  workflow_dispatch:

permissions:
  contents: write   # para guardar precios_super.json en el repositorio
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || hashFiles('lugares.json') == ''
        with:
          python-version: "3.12"

      # Respeta robots.txt, una búsqueda por producto con pausa. Si una tienda no responde, se publica igual.
      - name: Precios online de supermercados
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          pip install pyyaml
          python scripts/supermercados.py --config scripts/supermercados.yaml --salida precios_super.json --pausa 2.5

      # Mercados y supermercados de Lima y Callao desde OpenStreetMap: los lunes (el extracto de BBBike es semanal),
      # al correrlo a mano, o si falta el archivo. Una sola descarga de ~30 MB.
      - name: Mercados y supermercados cercanos (OpenStreetMap)
        if: github.event_name != 'push' || hashFiles('lugares.json') == ''
        continue-on-error: true
        run: |
          if [ ! -f lugares.json ] || [ "$(date -u +%u)" = "1" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            pip install osmium shapely
            python scripts/lugares.py --salida lugares.json
            rm -f Lima.osm.pbf
          fi

      - name: Guardar precios y lugares
        if: github.event_name != 'push' || hashFiles('lugares.json') == ''
        continue-on-error: true
        run: |
          git config user.name "acuanto-bot"
          git config user.email "acuanto-bot@users.noreply.github.com"
          for f in precios_super.json lugares.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Precios del día y lugares"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
